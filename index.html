    e.days.forEach(function(day,di){
      h+='<div class="card" style="margin-bottom:10px">';
      // Session header
      h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">';
      h+='<input type="text" value="'+day.label+'" placeholder="Session name" oninput="S.customEdit.days['+di+'].label=this.value;sv()" style="flex:1;font-size:13px">';
      h+='<button class="btn-ghost btn-sm" style="color:var(--mu)" onclick="removeBuildDay('+di+')">✕</button>';
      h+='</div>';

      // Exercise rows
      day.exercises.forEach(function(exEntry,ei){
        var track=exEntry.track||resolveTrack(exEntry.name,exEntry.ph||'strength',exEntry.reps,exEntry.vol);
        var trackSummary=track.map(function(t){return t.charAt(0).toUpperCase()+t.slice(1);}).join('+');
        var phLabel={warmup:'Warm-Up',strength:'Strength',accessory:'Accessory',core:'Core',cardio:'Cardio',mobility:'Mobility',cooldown:'Cool Down'};
        var volStr=exEntry.reps>0?(exEntry.sets+'×'+exEntry.reps):(exEntry.vol||'—');
        h+='<div style="border-top:0.5px solid var(--brd);padding:8px 0">'
        h+='<div style="display:flex;align-items:center;gap:8px">'
        h+='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex-shrink:0;align-self:stretch">';
        if(ei>0)h+='<button onclick="moveBuildEx('+di+','+ei+',-1)" style="width:28px;height:26px;border-radius:6px;background:var(--bg3);border:0.5px solid var(--brd);color:var(--tx2);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center">↑</button>';
        else h+='<span style="width:28px;display:block"></span>';
        if(ei<day.exercises.length-1)h+='<button onclick="moveBuildEx('+di+','+ei+',1)" style="width:28px;height:26px;border-radius:6px;background:var(--bg3);border:0.5px solid var(--brd);color:var(--tx2);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center">↓</button>';
        else h+='<span style="width:28px;display:block"></span>';
        h+='</div>';
        h+='<div style="flex:1;min-width:0">'
        h+='<div style="font-size:13px;font-weight:600;color:var(--tx)">'+exEntry.name+'</div>'
        h+='<div style="font-size:10px;color:var(--mu);margin-top:2px">'+
           (phLabel[exEntry.ph]||'Strength')+' · '+trackSummary+' · '+volStr+' · '+
           (exEntry.rest||60)+'s rest</div>'
        h+='</div>'
        h+='<button onclick="openExConfig('+di+','+ei+')" style="background:none;border:none;color:var(--acc);cursor:pointer;font-size:13px;padding:2px 6px;font-weight:700;flex-shrink:0">Edit</button>'
        h+='<button onclick="removeBuildEx('+di+','+ei+')" style="background:none;border:none;color:var(--mu);cursor:pointer;font-size:14px;padding:2px 4px;flex-shrink:0">✕</button>'
        h+='</div></div>'
      });

      h+='<button class="btn btn-ghost btn-sm" style="margin-top:8px;width:100%" onclick="openExPicker('+di+')">+ Add Exercise</button>';
      h+='</div>';
    });
  }

  h+='<button class="btn btn-ghost" style="margin-bottom:8px" onclick="addBuildDay()">+ Add Session</button>';
  h+='<button class="btn btn-acc" onclick="saveBuildProgram()">Save Training Plan</button>';
  return h;
}

// ─── EXERCISE CONFIG SHEET ───────────────────────────────────────
function buildStepper(di,ei,field,value,label,suffix,delta,min,max){
  return '<div style="margin-bottom:14px">'+
    '<div class="lbl" style="margin-bottom:6px">'+label+'</div>'+
    '<div style="display:flex;align-items:center;gap:0">'+
    '<button onclick="adjBuildEx('+di+','+ei+',\''+field+'\',-'+delta+')" style="width:40px;height:40px;border-radius:8px 0 0 8px;background:var(--bg3);border:0.5px solid var(--brd);color:var(--tx);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center">-</button>'+
    '<div id="bex-'+field+'" style="flex:1;height:40px;background:var(--bg2);border-top:0.5px solid var(--brd);border-bottom:0.5px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--acc)">'+value+(suffix||'')+'</div>'+
    '<button onclick="adjBuildEx('+di+','+ei+',\''+field+'\','+delta+')" style="width:40px;height:40px;border-radius:0 8px 8px 0;background:var(--bg3);border:0.5px solid var(--brd);color:var(--tx);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center">+</button>'+
    '</div></div>';
}

function openExConfig(di,ei){
  var exEntry=S.customEdit.days[di].exercises[ei];
  var track=exEntry.track||resolveTrack(exEntry.name,exEntry.ph||'strength',exEntry.reps,exEntry.vol);
  var phases=['warmup','activation','mobility','strength','accessory','core','cardio','cooldown'];
  var phaseLabels={warmup:'Warm-Up',activation:'Activation',mobility:'Mobility',strength:'Strength',accessory:'Accessory',core:'Core',cardio:'Cardio',cooldown:'Cool Down'};
  var allTrack=['reps','weight','time','distance','calories','rounds','height'];
  var trackLabels={reps:'Reps',weight:'Weight',time:'Time',distance:'Distance',calories:'Calories',rounds:'Rounds',height:'Height'};

  var h='<div style="padding:0 20px 30px">';
  h+='<div style="font-size:16px;font-weight:800;color:var(--tx);margin-bottom:16px">'+exEntry.name+'</div>';

  // Phase selector
  h+='<div class="lbl" style="margin-bottom:8px">PHASE</div>';
  h+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">';
  phases.forEach(function(ph){
    var isActive=(exEntry.ph||'strength')===ph;
    h+='<button class="btn btn-pill'+(isActive?' btn-acc':' btn-ghost')+'" onclick="setBuildExPh('+di+','+ei+',\''+ph+'\')">'+phaseLabels[ph]+'</button>';
  });
  h+='</div>';

  // Track field pills
  h+='<div class="lbl" style="margin-bottom:8px">TRACK FIELDS</div>';
  h+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">';
  allTrack.forEach(function(t){
    var isActive=track.indexOf(t)>=0;
    h+='<button class="btn btn-pill'+(isActive?' btn-acc':' btn-ghost')+'" onclick="toggleBuildExTrack('+di+','+ei+',\''+t+'\')">'+trackLabels[t]+'</button>';
  });
  h+='</div>';

  // ── Divider before steppers ──
  h+='<div style="border-top:0.5px solid var(--brd);margin-bottom:14px"></div>';

  // Sets — always shown
  h+=buildStepper(di,ei,'sets',exEntry.sets||3,'SETS','',1,1,20);

  // Per-track steppers — one for each active field
  if(track.indexOf('reps')>=0)
    h+=buildStepper(di,ei,'reps',exEntry.reps||10,'REPS','',1,0,100);

  if(track.indexOf('weight')>=0)
    h+=buildStepper(di,ei,'weight',exEntry.weight||0,'WEIGHT (kg, 0=BW)','kg',2.5,0,300);

  if(track.indexOf('time')>=0){
    var volSecs=parseVolToSecs(exEntry.vol||'45s');
    h+='<div style="margin-bottom:14px"><div class="lbl" style="margin-bottom:6px">DURATION</div>'+
       '<div style="display:flex;align-items:center;gap:0">'+
       '<button onclick="adjBuildEx('+di+','+ei+',\'vol\',-5)" style="width:40px;height:40px;border-radius:8px 0 0 8px;background:var(--bg3);border:0.5px solid var(--brd);color:var(--tx);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center">-</button>'+
       '<div id="bex-vol" style="flex:1;height:40px;background:var(--bg2);border-top:0.5px solid var(--brd);border-bottom:0.5px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--acc)">'+fmtSecs(volSecs)+'</div>'+
       '<button onclick="adjBuildEx('+di+','+ei+',\'vol\',5)" style="width:40px;height:40px;border-radius:0 8px 8px 0;background:var(--bg3);border:0.5px solid var(--brd);color:var(--tx);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center">+</button>'+
       '</div></div>';
  }

  if(track.indexOf('distance')>=0)
    h+=buildStepper(di,ei,'distance',exEntry.distance||20,'DISTANCE (metres)','m',5,0,1000);

  if(track.indexOf('calories')>=0)
    h+=buildStepper(di,ei,'calories',exEntry.calories||10,'CALORIES TARGET','cal',1,0,500);

  if(track.indexOf('rounds')>=0)
    h+=buildStepper(di,ei,'rounds',exEntry.rounds||3,'ROUNDS','',1,1,20);

  if(track.indexOf('height')>=0)
    h+=buildStepper(di,ei,'height',exEntry.height||50,'HEIGHT (cm)','cm',5,0,150);

  // Rest — always shown
  h+=buildStepper(di,ei,'rest',exEntry.rest||60,'REST (seconds)','s',15,0,300);

  // Cue
  h+='<div class="lbl" style="margin-bottom:6px">COACHING CUE (optional)</div>';
  h+='<input type="text" value="'+(exEntry.cue||'')+'" placeholder="e.g. Keep chest up" oninput="S.customEdit.days['+di+'].exercises['+ei+'].cue=this.value;sv()" style="margin-bottom:20px">';

  h+='<button class="btn btn-acc" onclick="closeSheet();sv();draw()">Done</button>';
  h+='</div>';
  openSheet(h,null);
}

// ─── Exercise config helpers ──────────────────────────────────────
function setBuildExPh(di,ei,ph){
  S.customEdit.days[di].exercises[ei].ph=ph;
  sv();
  openExConfig(di,ei);
}
function toggleBuildExTrack(di,ei,field){
  var ex=S.customEdit.days[di].exercises[ei];
  if(!ex.track)ex.track=resolveTrack(ex.name,ex.ph||'strength',ex.reps,ex.vol);
  var idx=ex.track.indexOf(field);
  if(idx>=0)ex.track.splice(idx,1);
  else ex.track.push(field);
  sv();
  openExConfig(di,ei);
}
function adjBuildEx(di,ei,field,delta){
  var ex=S.customEdit.days[di].exercises[ei];
  if(field==='sets'){
    ex.sets=Math.max(1,Math.min(10,(ex.sets||3)+delta));
    var el=document.getElementById('bex-sets');if(el)el.textContent=ex.sets;
  } else if(field==='reps'){
    ex.reps=Math.max(0,Math.min(50,(ex.reps||10)+delta));
    var el=document.getElementById('bex-reps');if(el)el.textContent=ex.reps;
  } else if(field==='rest'){
    ex.rest=Math.max(0,Math.min(300,(ex.rest||60)+delta));
    var el=document.getElementById('bex-rest');if(el)el.textContent=ex.rest+'s';
  } else if(field==='vol'){
    var cur=parseVolToSecs(ex.vol||'45s');
    var next=Math.max(5,cur+delta);
    ex.vol=next+'s';
    var el=document.getElementById('bex-vol');if(el)el.textContent=fmtSecs(next);
  } else if(field==='weight'){
    ex.weight=Math.max(0,Math.round(((ex.weight||0)+delta)*10)/10);
    var el=document.getElementById('bex-weight');if(el)el.textContent=ex.weight+'kg';
  } else if(field==='distance'){
    ex.distance=Math.max(0,(ex.distance||20)+delta);
    var el=document.getElementById('bex-distance');if(el)el.textContent=ex.distance+'m';
  } else if(field==='calories'){
    ex.calories=Math.max(0,(ex.calories||10)+delta);
    var el=document.getElementById('bex-calories');if(el)el.textContent=ex.calories+'cal';
  } else if(field==='rounds'){
    ex.rounds=Math.max(1,(ex.rounds||3)+delta);
    var el=document.getElementById('bex-rounds');if(el)el.textContent=ex.rounds;
  } else if(field==='height'){
    ex.height=Math.max(0,(ex.height||50)+delta);
    var el=document.getElementById('bex-height');if(el)el.textContent=ex.height+'cm';
  }
  sv();
}
function moveBuildEx(di,ei,dir){
  var exs=S.customEdit.days[di].exercises;
  var ni=ei+dir;
  if(ni<0||ni>=exs.length)return;
  var tmp=exs[ei];exs[ei]=exs[ni];exs[ni]=tmp;
  sv();draw();
}

// ─── Exercise picker ──────────────────────────────────────────────
function setBuildDays(n){
  S.customEdit.numDays=n;
  while(S.customEdit.days.length<n)S.customEdit.days.push({label:'Session '+(S.customEdit.days.length+1),focus:'',exercises:[]});
  S.customEdit.days=S.customEdit.days.slice(0,n);
  sv();draw();
}
function addBuildDay(){
  S.customEdit.days.push({label:'Session '+(S.customEdit.days.length+1),focus:'',exercises:[]});
  S.customEdit.numDays=S.customEdit.days.length;sv();draw();
}
function removeBuildDay(di){S.customEdit.days.splice(di,1);S.customEdit.numDays=S.customEdit.days.length;sv();draw();}
function removeBuildEx(di,ei){S.customEdit.days[di].exercises.splice(ei,1);sv();draw();}
function openExPicker(di){
  S.customEdit.activeDay=di;sv();
  var h='<div style="padding:0 20px 20px">';
  h+='<input type="text" id="ex-search" placeholder="Type to search exercises…" oninput="filterExPicker()" style="margin-bottom:8px" autofocus>';
  h+='<button class="btn btn-ghost btn-sm" style="width:100%;margin-bottom:12px" onclick="openExBrowser()">Browse by movement pattern ›</button>';
  h+='<div id="ex-results"><div style="font-size:12px;color:var(--mu);text-align:center;padding:20px 0">Start typing to search…</div></div>';
  h+='</div>';
  openSheet(h,'Add Exercise');
}
function filterExPicker(){
  var q=(document.getElementById('ex-search')||{}).value||'';
  var el=document.getElementById('ex-results');if(!el)return;
  if(q.trim().length<2){
    el.innerHTML='<div style="font-size:12px;color:var(--mu);text-align:center;padding:20px 0">Start typing to search…</div>';
    return;
  }
  q=q.toLowerCase();
  var results=EX.filter(function(e){return e.name.toLowerCase().indexOf(q)>=0||(e.tags||[]).join(' ').indexOf(q)>=0;}).slice(0,40);
  if(results.length===0){
    el.innerHTML='<div style="padding:10px 0">'+
      '<div style="font-size:12px;color:var(--mu);text-align:center;padding:8px 0 12px">No exercises found in database</div>'+
      '<div class="prog-item" data-name="'+q+'" onclick="addBuildEx(this.dataset.name)" style="background:var(--acc-bg);border-color:var(--acc-brd)">'+
      '<div><div style="font-size:13px;font-weight:700;color:var(--acc)">✚ Add \u201c'+q+'\u201d as custom exercise</div>'+
      '<div class="lbl">Not in database · set track fields manually</div></div>'+
      '<button class="btn btn-acc btn-pill">Add</button></div>'+
      '</div>';
    return;
  }
  // Also append custom option below results
  var customRow='<div class="prog-item" data-name="'+q+'" onclick="addBuildEx(this.dataset.name)" style="margin-top:4px;background:var(--bg3);border-color:var(--brd)">'+
    '<div><div style="font-size:12px;font-weight:600;color:var(--mu)">✚ Can\'t find it? Add \u201c'+q+'\u201d as custom exercise</div></div>'+
    '<button class="btn btn-ghost btn-pill">Add</button></div>';
  el.innerHTML=results.map(function(e){
    return '<div class="prog-item" data-name="'+e.name+'" onclick="addBuildEx(this.dataset.name)"><div><div style="font-size:13px;font-weight:600">'+e.name+'</div><div class="lbl">'+e.patterns.join(' · ')+'</div></div><button class="btn btn-acc btn-pill">Add</button></div>';
  }).join('')+customRow;
}
function openExBrowser(){
  var patterns=['squat','hinge','push','pull','lunge','carry','core','rotation','explosive','conditioning','locomotion'];
  var patternLabels={squat:'Squat',hinge:'Hinge',push:'Push',pull:'Pull',lunge:'Lunge',
    carry:'Carry',core:'Core',rotation:'Rotation',explosive:'Explosive',
    conditioning:'Conditioning',locomotion:'Locomotion'};
  var di=S.customEdit.activeDay;
  var h='<div style="padding:0 20px 30px">';
  patterns.forEach(function(pat){
    var exs=EX.filter(function(e){return e.patterns&&e.patterns.indexOf(pat)>=0;});
    if(exs.length===0)return;
    var isOpen=S._browserOpen&&S._browserOpen[pat];
    h+='<div style="margin-bottom:3px">';
    h+='<div class="group-head'+(isOpen?' open':'')+'" data-pat="'+pat+'" onclick="toggleExBrowserGroup(this.dataset.pat)" style="font-size:13px;font-weight:700;color:var(--acc)">'+patternLabels[pat]+'<span style="color:var(--mu);font-size:12px;float:right">'+exs.length+' '+(isOpen?'▴':'▾')+'</span></div>';
    if(isOpen){
      h+='<div class="group-body">';
      exs.forEach(function(e){
        h+='<div class="prog-item" data-name="'+e.name+'" onclick="addBuildEx(this.dataset.name)">';
        h+='<div><div style="font-size:13px;font-weight:600">'+e.name+'</div></div>';
        h+='<button class="btn btn-acc btn-pill">Add</button></div>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  h+='</div>';
  openSheet(h,'Browse Exercises');
}
function toggleExBrowserGroup(pat){
  if(!S._browserOpen)S._browserOpen={};
  S._browserOpen[pat]=!S._browserOpen[pat];
  // Redraw sheet in place
  var di=S.customEdit.activeDay;
  openExBrowser();
}

function addBuildEx(name){
  var di=S.customEdit.activeDay;if(di===null||di===undefined)return;
  var defaultEx=EX_MAP[exKey(name)]||{};
  var ph=defaultEx.phases&&defaultEx.phases.length>0?defaultEx.phases[0]:'strength';
  // Map EX phases to our phases
  var phMap={kpi:'strength',activation:'warmup',primer:'strength',finisher:'accessory',cooldown:'cooldown',warmup:'warmup',accessory:'accessory',core:'core'};
  ph=phMap[ph]||'strength';
  var track=resolveTrack(name,ph,10,null);
  var hasTime=track.indexOf('time')>=0&&track.indexOf('reps')<0;
  S.customEdit.days[di].exercises.push({
    name:name,sets:3,reps:hasTime?0:10,rest:90,
    ph:ph,cue:'',vol:hasTime?'45s':'',track:track
  });
  closeSheet();sv();draw();
}
function saveBuildProgram(){
  var e=S.customEdit;
  if(!e.name||e.days.length===0){alert('Add a name and at least one session.');return;}
  var key='custom_'+(Date.now());var cl=C();
  if(!cl.customPrograms)cl.customPrograms=[];
  var tplDays=e.days.map(function(d){
    return {label:d.label,focus:d.label,exercises:d.exercises.map(function(ex){
      return {name:ex.name,sets:ex.sets,reps:ex.reps||0,vol:ex.vol||'',
              rest:ex.rest||60,ph:ex.ph||'strength',cue:ex.cue||'',
              track:ex.track||resolveTrack(ex.name,ex.ph||'strength',ex.reps,ex.vol)};
    })};
  });
  cl.customPrograms.push({key:key,name:e.name,cat:'custom',desc:'Custom training plan',
    days:tplDays.length,duration:55,defaultPlan:'wave_3_1',tpl:{
      key:key,name:e.name,cat:'custom',desc:'Custom training plan',
      days:tplDays,duration:55
    }
  });
  S.customEdit={name:'My Plan',numDays:3,days:[],activeDay:null};
  sv();
  // Clear confirm dialog
  if(confirm('Training plan saved! Switch to it now?')){
    C().tplKey=key;C().day=0;sv();
  }
  draw();
}

// ─── PROGRESSION PLAN BUILDER ────────────────────────────────────

        h+='<div style="display:flex;align-items:center">';
        h+='<button onclick="adjPlanWeek('+wi+',\''+f.key+'\','+(-f.step)+','+f.min+','+f.max+')"'
          +' style="width:40px;height:40px;border-radius:8px 0 0 8px;background:var(--bg3);border:0.5px solid var(--brd);color:var(--tx);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center">-</button>';
        h+='<div id="pw-'+wi+'-'+f.key+'" style="flex:1;height:40px;background:var(--bg2);border-top:0.5px solid var(--brd);border-bottom:0.5px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:var(--acc)">'+val+suffix+'</div>';
        h+='<button onclick="adjPlanWeek('+wi+',\''+f.key+'\','+f.step+','+f.min+','+f.max+')"'
          +' style="width:40px;height:40px;border-radius:0 8px 8px 0;background:var(--bg3);border:0.5px solid var(--brd);color:var(--tx);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center">+</button>';
        h+='</div></div>';
      });
      h+='</div>';
      // Coach tip
      h+='<div class="lbl" style="margin-bottom:4px">COACH TIP</div>';
      h+='<textarea placeholder="e.g. Focus on technique this week." oninput="S.planEdit.weeks['+wi+'].tip=this.value;sv()" style="min-height:52px;font-size:12px">'+wk.tip+'</textarea>';
      h+='</div>';
    });
  }

  h+='<button class="btn btn-acc" style="margin-top:8px" onclick="saveBuildPlan()">Save Progression Plan</button>';
  return h;
}

function adjPlanWeek(wi,key,delta,min,max){
  var wk=S.planEdit.weeks[wi];
  if(key==='volMod'){
    var cur=Math.round((wk.volMod||1)*100);
    var next=Math.max(min,Math.min(max,cur+delta));
    wk.volMod=next/100;
    var el=document.getElementById('pw-'+wi+'-volMod');if(el)el.textContent=next+'%';
  } else {
    wk[key]=Math.max(min,Math.min(max,(wk[key]||0)+delta));
    var suffix=key==='defaultRest'?'s':'';
    var el=document.getElementById('pw-'+wi+'-'+key);if(el)el.textContent=wk[key]+suffix;
    // Sync RPE ↔ RIR: RIR = 10 - RPE
    if(key==='rpe'){
      wk.rir=Math.max(0,Math.min(5,10-wk.rpe));
      var rirEl=document.getElementById('pw-'+wi+'-rir');
      if(rirEl)rirEl.textContent=wk.rir;
    } else if(key==='rir'){
      wk.rpe=Math.max(1,Math.min(10,10-wk.rir));
      var rpeEl=document.getElementById('pw-'+wi+'-rpe');
      if(rpeEl)rpeEl.textContent=wk.rpe;
    }
  }
  sv();
}

function setBuildPlanWeeks(n){
  S.planEdit.targetWeeks=n;
  while(S.planEdit.weeks.length<n)S.planEdit.weeks.push({
    label:'Week '+(S.planEdit.weeks.length+1),theme:'build',
    rpe:7,rir:3,volMod:1.0,defaultRest:90,tip:''
  });
  S.planEdit.weeks=S.planEdit.weeks.slice(0,n);
  sv();draw();
}
function saveBuildPlan(){
  var e=S.planEdit;
  if(!e.name||e.weeks.length===0){alert('Add a name and at least one week.');return;}
  var key='cplan_'+(Date.now());var cl=C();
  if(!cl.customPlans)cl.customPlans=[];
  cl.customPlans.push({key:key,name:e.name,desc:'Custom progression plan',cyclic:e.cyclic,weeks:e.weeks});
  S.planEdit={name:'My Plan',targetWeeks:4,cyclic:true,weeks:[],editWeek:null};
  sv();
  if(confirm('Progression plan saved! Attach it now?')){
    attachPlan(key);sv();
  }
  draw();
}

function draw(){
  applyTheme();
  var screen=document.getElementById('screen');
  var cl=C();

  // Admin badge
  var badge=document.getElementById('admin-badge');
  if(S.admin.active&&S.admin.expiry&&Date.now()>S.admin.expiry){S.admin.active=false;sv();}
  if(badge)badge.style.display=S.admin.active?'block':'none';

  // Onboarding gate
  if(!cl.ob.done){
    screen.innerHTML=obV();
    document.getElementById('tabbar').style.opacity='0.3';
    bindScreen();return;
  }
  document.getElementById('tabbar').style.opacity='1';

  // Tab content
  var content='';
  if(S.tab==='home')content=homeV();
  else if(S.tab==='today')content=todayV();
  else if(S.tab==='programs')content=programsV();
  else if(S.tab==='build')content=buildV();
  else if(S.tab==='timer')content=timerV();
  screen.innerHTML=content;

  // Tab bar active state
  document.querySelectorAll('.tb').forEach(function(tb){
    tb.classList.toggle('on',tb.dataset.tab===S.tab);
  });

  // Floating Start Session button (TODAY only, no active session)
  var existingFab=document.getElementById('fab-start');
  if(existingFab)existingFab.parentNode.removeChild(existingFab);
  if(S.tab==='today'&&!S.wx){
    var fab=document.createElement('div');
    fab.id='fab-start';
    var fabX=S._fabX!==null&&S._fabX!==undefined?S._fabX:(window.innerWidth-88-16);
    var fabY=S._fabY!==null&&S._fabY!==undefined?S._fabY:(window.innerHeight-88-80);
    Object.assign(fab.style,{
      position:'fixed',left:fabX+'px',top:fabY+'px',
      width:'88px',height:'88px',
      zIndex:'150',cursor:'pointer',userSelect:'none',touchAction:'none'
    });
    var _fabR=36;var _fabCirc=2*Math.PI*_fabR;
    fab.innerHTML=
      '<svg width="88" height="88" viewBox="0 0 88 88" style="position:absolute;top:0;left:0">'+
        '<circle cx="44" cy="44" r="'+_fabR+'" fill="var(--acc-bg)" stroke="var(--acc-brd)" stroke-width="1.5"/>'+
        '<circle cx="44" cy="44" r="'+_fabR+'" fill="none" stroke="var(--acc)" stroke-width="3.5"'+
          ' stroke-dasharray="'+_fabCirc+'" stroke-dashoffset="0"'+
          ' stroke-linecap="round" transform="rotate(-90 44 44)"/>'+
      '</svg>'+
      '<div style="position:absolute;top:0;left:0;width:100%;height:100%;'+
        'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;pointer-events:none">'+
        '<div style="font-size:26px;color:var(--acc);line-height:1">▶</div>'+
        '<div style="font-size:9px;font-weight:800;letter-spacing:1.5px;color:var(--acc);opacity:.8">START</div>'+
      '</div>';
    // Tap to start
    var _fabDragStart={x:0,y:0};var _fabDragging=false;var _fabMoved=false;
    var _fabElStart={x:fabX,y:fabY};
    function fabDown(cx,cy){_fabDragging=true;_fabMoved=false;_fabDragStart={x:cx,y:cy};_fabElStart={x:parseInt(fab.style.left),y:parseInt(fab.style.top)};fab.style.transition='none';}
    function fabMove(cx,cy){
      if(!_fabDragging)return;
      var dx=cx-_fabDragStart.x;var dy=cy-_fabDragStart.y;
      if(Math.abs(dx)>5||Math.abs(dy)>5)_fabMoved=true;
      var nx=Math.max(0,Math.min(window.innerWidth-100,_fabElStart.x+dx));
      var ny=Math.max(0,Math.min(window.innerHeight-100,_fabElStart.y+dy));
      fab.style.left=nx+'px';fab.style.top=ny+'px';
      S._fabX=nx;S._fabY=ny;
    }
    function fabUp(cx,cy){
      if(!_fabDragging)return;_fabDragging=false;fab.style.transition='';
      if(!_fabMoved){
        // Tap — start session + open first exercise
        startSession();draw();
        setTimeout(function(){autoOpenNextEx();},300);
      }
    }
    fab.addEventListener('touchstart',function(e){fabDown(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
    fab.addEventListener('touchmove',function(e){fabMove(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault();},{passive:false});
    fab.addEventListener('touchend',function(e){fabUp(e.changedTouches[0].clientX,e.changedTouches[0].clientY);});
    fab.addEventListener('mousedown',function(e){fabDown(e.clientX,e.clientY);});
    document.addEventListener('mousemove',function(e){if(_fabDragging)fabMove(e.clientX,e.clientY);});
    document.addEventListener('mouseup',function(e){if(_fabDragging)fabUp(e.clientX,e.clientY);});
    document.getElementById('app').appendChild(fab);
  }

  bindScreen();initAdminLongPress();

  // Init session drum on today tab
  if(S.tab==='today'){
    var tpl=ACTIVE_TPL();var cl2=C();
    var dayIdx=cl2.day%tpl.days.length;
    initDrumScroll('session-sel',tpl.days.map(function(d,i){return{val:i,label:d.label||(d.focus||'Day '+(i+1))};}),dayIdx,function(v){
      cl2.day=v;sv();
      // Rebuild exercise list area without full redraw
      var s=document.getElementById('screen');
      if(s)s.scrollTop=0;
      draw();
    });
  }

  // Re-attach timer tick if running
  if(S.tab==='timer'&&S.timer.running&&!S.timer.setup){
    setTimeout(startTimerTick,0);
  }
}

  } else if(t.mode==='emom'){
    if(t.setup){
      h+='<div style="margin-bottom:14px"><div class="lbl" style="margin-bottom:6px">TOTAL MINUTES</div><div style="display:flex;align-items:center;gap:0"><button onclick="adjTimer(\'emomMins\',-1)" style="width:48px;height:48px;border-radius:10px 0 0 10px;background:var(--bg3);border:0.5px solid var(--brd);color:var(--tx);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center">-</button><div id="t-emom-mins" style="flex:1;height:48px;background:var(--bg2);border-top:0.5px solid var(--brd);border-bottom:0.5px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--acc)">'+t.emomMins+' min'+'</div><button onclick="adjTimer(\'emomMins\',1)" style="width:48px;height:48px;border-radius:0 10px 10px 0;background:var(--bg3);border:0.5px solid var(--brd);color:var(--tx);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center">+</button></div></div>';
      h+='<button class="btn btn-acc" onclick="startEMOM()">Start</button>';
    } else {
      var secInMin=t.elapsed%60;var emRem=60-secInMin;var emRd=t.emomRound;
      h+='<div style="text-align:center;padding:20px 0">';
      h+='<div class="lbl" style="font-size:14px;margin-bottom:8px">MINUTE '+(emRd+1)+' / '+t.emomMins+'</div>';
      h+='<div id="timer-big" style="font-size:80px;font-weight:900;letter-spacing:-2px;color:var(--acc);line-height:1">'+emRem+'</div>';
      h+='<div class="lbl" style="margin-top:10px">seconds remaining</div>';
      h+='</div>';
      h+='<div style="display:flex;gap:8px">';
      h+='<button class="btn'+(t.running?' btn-ghost':' btn-acc')+'" onclick="timerToggle()" style="flex:1">'+(t.running?'Pause':'Resume')+'</button>';
      h+='<button class="btn btn-ghost" onclick="timerReset()" style="flex:1">Reset</button>';
      h+='</div>';
    }
  }

  h+='</div>';
  return h;
}

// ── Timer stepper adjustments ──
function adjTimer(field,delta){
  var t=S.timer;
  if(field==='cdMins'){
    var mins=Math.max(0,Math.min(99,Math.floor(t.totalSecs/60)+delta));
    t.totalSecs=mins*60+(t.totalSecs%60);
    var el=document.getElementById('t-cd-mins');if(el)el.textContent=mins+'m';
  } else if(field==='cdSecs'){
    var secs=Math.max(0,Math.min(55,(t.totalSecs%60)+delta));
    t.totalSecs=Math.floor(t.totalSecs/60)*60+secs;
    var el=document.getElementById('t-cd-secs');if(el)el.textContent=secs+'s';
  } else if(field==='tabWork'){
    t.tabWork=Math.max(5,Math.min(300,t.tabWork+delta));
    var el=document.getElementById('t-tab-work');if(el)el.textContent=t.tabWork+'s';
  } else if(field==='tabRest'){
    t.tabRest=Math.max(0,Math.min(300,t.tabRest+delta));
    var el=document.getElementById('t-tab-rest');if(el)el.textContent=t.tabRest+'s';
  } else if(field==='tabRounds'){
    t.tabRounds=Math.max(1,Math.min(50,t.tabRounds+delta));
    var el=document.getElementById('t-tab-rounds');if(el)el.textContent=t.tabRounds;
  } else if(field==='emomMins'){
    t.emomMins=Math.max(1,Math.min(60,t.emomMins+delta));
    var el=document.getElementById('t-emom-mins');if(el)el.textContent=t.emomMins+' min';
  }
  sv();
}

// ── Timer controls ──
function setTimerMode(m){
  S.timer.mode=m;S.timer.setup=true;S.timer.running=false;
  if(_timerTick){clearInterval(_timerTick);_timerTick=null;}
  sv();draw();
}
function startCountdown(){
  var t=S.timer;
  if(t.totalSecs<=0)return;
  t.remaining=t.totalSecs;t.setup=false;t.running=true;
  sv();draw();startTimerTick();
}
function startTabata(){
  var t=S.timer;
  t.tabCurrent=0;t.tabPhase='work';t.remaining=t.tabWork;
  t.setup=false;t.running=true;
  sv();draw();startTimerTick();
}
function startEMOM(){
  var t=S.timer;
  t.emomRound=0;t.elapsed=0;
  t.setup=false;t.running=true;
  sv();draw();startTimerTick();
}
function timerToggle(){
  S.timer.running=!S.timer.running;sv();
  if(S.timer.running)startTimerTick();
  else{if(_timerTick){clearInterval(_timerTick);_timerTick=null;}}
  draw();
}
function timerReset(){
  S.timer.running=false;S.timer.setup=true;S.timer.elapsed=0;
  S.timer.remaining=S.timer.totalSecs;
  if(_timerTick){clearInterval(_timerTick);_timerTick=null;}
  sv();draw();
}

// ── Timer tick ──
var _timerTick=null;
function startTimerTick(){
  if(_timerTick){clearInterval(_timerTick);_timerTick=null;}
  _timerTick=setInterval(function(){
    var t=S.timer;
    if(!t.running){clearInterval(_timerTick);_timerTick=null;return;}
    if(t.mode==='stopwatch'){
      t.elapsed++;sv();
      if(S.tab==='timer'){
        var big=document.getElementById('timer-big');
        if(big){var m=Math.floor(t.elapsed/60);var s=t.elapsed%60;
          big.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
      }
    } else if(t.mode==='countdown'){
      if(t.remaining>0){t.remaining--;sv();}
      else{t.running=false;sv();draw();return;}
      if(S.tab==='timer'){
        var big=document.getElementById('timer-big');
        if(big){var m=Math.floor(t.remaining/60);var s=t.remaining%60;
          big.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
      }
    } else if(t.mode==='tabata'){
      if(t.remaining>0){t.remaining--;sv();}
      else{
        if(t.tabPhase==='work'){t.tabPhase='rest';t.remaining=t.tabRest;}
        else{
          t.tabCurrent++;
          if(t.tabCurrent>=t.tabRounds){t.running=false;t.setup=true;sv();draw();return;}
          t.tabPhase='work';t.remaining=t.tabWork;
        }
        sv();draw();return;
      }
      if(S.tab==='timer'){var big=document.getElementById('timer-big');if(big)big.textContent=t.remaining;}
    } else if(t.mode==='emom'){
      t.elapsed++;sv();
      var newRound=Math.floor(t.elapsed/60);
      if(newRound!==t.emomRound){
        t.emomRound=newRound;
        if(newRound>=t.emomMins){t.running=false;t.setup=true;sv();draw();return;}
        draw();return;
      }
      if(S.tab==='timer'){
        var big=document.getElementById('timer-big');
        if(big)big.textContent=60-(t.elapsed%60);
      }
    }
  },1000);
}


function bindScreen(){
  document.querySelectorAll('.tb').forEach(function(tb){
    tb.onclick=function(){
      var newTab=this.dataset.tab;
      var tabChanged=newTab!==S.tab;
      S.tab=newTab;sv();draw();
      if(tabChanged)document.getElementById('screen').scrollTop=0;
    };
  });
}


// ═══════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════
// PULL TO REFRESH
// ═══════════════════════════════════════════════════════════════
function initPullToRefresh(){
  var screen=document.getElementById('screen');
  var indicator=document.getElementById('ptr-indicator');
  var startY=0,pulling=false,triggered=false;
  var THRESHOLD=72;

  screen.addEventListener('touchstart',function(e){
    if(screen.scrollTop===0){
      startY=e.touches[0].clientY;
      pulling=true;
      triggered=false;
    }
  },{passive:true});

  screen.addEventListener('touchmove',function(e){
    if(!pulling)return;
    var dy=e.touches[0].clientY-startY;
    if(dy>0&&screen.scrollTop===0){
      var progress=Math.min(dy,THRESHOLD*1.5);
      var pct=Math.min(progress/THRESHOLD,1);
      indicator.style.transform='translateX(-50%) translateY('+(pct*52-4)+'px)';
      indicator.style.opacity=pct;
      if(pct>=1&&!triggered){
        triggered=true;
        indicator.classList.add('ptr-spinning');
      }
    }
  },{passive:true});

  screen.addEventListener('touchend',function(){
    if(!pulling)return;
    pulling=false;
    if(triggered){
      indicator.classList.add('ptr-visible');
      setTimeout(function(){location.reload();},400);
    } else {
      indicator.style.transform='';
      indicator.style.opacity='';
    }
  });
}

// BOOT
// ═══════════════════════════════════════════════════════════════
ld();
document.documentElement.classList.toggle('light',S.theme==='light');
draw();
initPullToRefresh();

// Service Worker registration
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
