<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Train">
<meta name="theme-color" content="#0f1923">
<link rel="manifest" href="manifest.json">
<title>Train</title>
<style>
/* OCEAN DARK (default) */
:root{
  --bg:#0f1923;--bg2:#162535;--bg3:#1e3a4a;
  --acc:#38BDF8;--acc2:#0ea5e9;
  --tx:#e0f2fe;--mu:#4a7a99;--dim:#2d5a70;--brd:#1e3a4a;
  --ok:#22d3ee;--warn:#fbbf24;
  --acc-bg:#0d2030;--acc2-bg:#071e2e;
  --acc-tx:#bae6fd;--acc2-tx:#bae6fd;
  --acc-sub:#2d6a8a;--acc2-sub:#0369a1;
  --str-bg:#0d2030;--str-brd:#1e4a66;
  --nb-bg:#1e3a4a;
}
/* OCEAN LIGHT */
.light{
  --bg:#f0f7ff;--bg2:#ffffff;--bg3:#e6f1fb;
  --acc:#0369a1;--acc2:#0284c7;
  --tx:#042c53;--mu:#4a7a99;--dim:#93c5fd;--brd:#bfdbfe;
  --ok:#0891b2;--warn:#d97706;
  --acc-bg:#f0f9ff;--acc2-bg:#e0f2fe;
  --acc-tx:#0c4a6e;--acc2-tx:#0c4a6e;
  --acc-sub:#0369a1;--acc2-sub:#0284c7;
  --str-bg:#e0f2fe;--str-brd:#7dd3fc;
  --nb-bg:#e6f1fb;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;transition:background .2s,color .2s}
#app{max-width:430px;margin:0 auto;min-height:100vh}
.pad{padding:20px 16px 90px}
.lbl{font-size:10px;letter-spacing:.8px;color:var(--mu);text-transform:uppercase;font-weight:500}
.mu{font-size:13px;color:var(--mu);line-height:1.6}
.h1{font-size:22px;font-weight:500;line-height:1.3}
.h2{font-size:18px;font-weight:500}
.card{background:var(--bg2);border-radius:16px;padding:16px;border:.5px solid var(--brd)}
.cacc{border-left:3px solid var(--acc);border-radius:0 12px 12px 0;background:var(--acc-bg)}
.cblu{border-left:3px solid var(--acc2);border-radius:0 12px 12px 0;background:var(--acc2-bg)}
.btn{display:block;width:100%;padding:16px;border:none;border-radius:14px;font-size:15px;font-weight:500;cursor:pointer;text-align:center;transition:opacity .15s}
.btn:active{opacity:.8}
.btnp{background:var(--acc);color:#fff}
.light .btnp{color:#fff}
.btno{background:transparent;border:1.5px solid var(--acc);color:var(--acc)}
.btng{background:transparent;border:none;color:var(--mu);cursor:pointer;width:100%;padding:12px;font-size:14px}
.pill{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:500}
.pgr{background:var(--bg3);color:var(--mu)}
.pac{background:var(--str-bg);color:var(--acc);border:.5px solid var(--str-brd)}
.pbl{background:var(--acc2-bg);color:var(--acc2)}
.pok{background:#071e28;color:var(--ok)}
.light .pok{background:#cffafe;color:#0e7490}
#tb{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bg2);border-top:.5px solid var(--brd);display:grid;grid-template-columns:repeat(4,1fr);padding:10px 0 24px;z-index:100;transition:background .2s}
.ti{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--dim);padding:4px}
.ti.on{color:var(--acc)}
.ti svg{width:22px;height:22px}
.ti span{font-size:10px;font-weight:500}
.exrow{background:var(--bg2);border-radius:12px;padding:13px 14px;margin-bottom:7px;display:flex;align-items:center;gap:12px;border:.5px solid var(--brd);cursor:pointer;transition:background .15s}
.exstr{background:var(--str-bg);border-color:var(--str-brd)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pb{background:var(--bg3);border-radius:4px;height:5px;overflow:hidden}
.pf{background:var(--acc);height:100%;border-radius:4px;transition:width .3s}
.opt{background:var(--bg2);border:1.5px solid var(--brd);border-radius:14px;padding:15px 18px;margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:border-color .15s,background .15s}
.opt.sel{border-color:var(--acc);background:var(--str-bg)}
.oico{width:36px;height:36px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--acc);flex-shrink:0}
.sp{width:24px;height:4px;border-radius:2px;background:var(--bg3)}
.sp.dn{background:var(--acc)}
.nb{background:var(--nb-bg);border:none;color:var(--tx);width:36px;height:36px;border-radius:10px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cue{font-size:13px;color:var(--mu);padding:6px 10px;border-left:2px solid var(--brd);margin:4px 0;line-height:1.5}
/* theme toggle button */
#tmb{background:var(--bg3);border:none;color:var(--tx);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="app">
  <div style="background:var(--bg2);padding:10px 16px 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:.5px solid var(--brd)">
    <span id="clk" style="font-size:11px;color:var(--mu);font-weight:500">9:41</span>
    <span style="font-size:13px;font-weight:500;color:var(--tx);letter-spacing:.5px">Train</span>
    <button id="tmb" onclick="toggleTheme()" aria-label="Toggle light/dark mode">&#9790;</button>
  </div>
  <div id="scr"></div>
  <nav id="tb" style="display:none">
    <div class="ti" id="t-home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg><span>Home</span></div>
    <div class="ti" id="t-today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="5 3 19 12 5 21 5 3"/></svg><span>Today</span></div>
    <div class="ti" id="t-programs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Programs</span></div>
    <div class="ti" id="t-progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Progress</span></div>
  </nav>
</div>

function fetchInfo(){
  if(!INFO_URL||INFO_URL==='YOUR_SCRIPT_URL_HERE')return;
  fetch(INFO_URL)
    .then(function(r){return r.json();})
    .then(function(data){
      if(Array.isArray(data)&&data.length>0){

        if(S.view==='app'&&S.tab==='home'&&!S.wx)draw();
      }
    })
    .catch(function(e){console.log('Info board offline, using defaults');});
}

    document.head.appendChild(lnk);
  }catch(e){}
}


function switchProgram(key){
  var entry=null;
  for(var i=0;i<CATALOGUE.length;i++)if(CATALOGUE[i].key===key)entry=CATALOGUE[i];
  if(!entry||!entry.available)return;
  var tplMap={balanced:typeof TPL!=='undefined'?TPL:null,hyp:typeof TPL_HYP!=='undefined'?TPL_HYP:null};
  var newTpl=tplMap[key];
  if(!newTpl)return;
  if(S.tplKey===key){go('today');return;}
  if(!confirm('Switch to '+entry.name+'? Your session history is kept.'))return;
  S.tplKey=key;
  ACTIVE_TPL=newTpl;
  S.day=0;
  sv();go('today');
}

    html+='<p style="font-size:11px;color:var(--dim);margin-bottom:10px">'+c.sessions+' · '+c.mins+'</p>';
    if(c.available){
      html+='<button class="btn btnp" style="padding:11px 16px;font-size:13px" data-switchprog="'+c.key+'">Switch to this program</button>';
    } else {
      html+='<p style="font-size:12px;color:var(--dim);font-style:italic">Coming soon</p>';
    }
    html+='</div></div></div>';
  }
  html+='<div style="margin-top:20px"><span class="lbl" style="display:block;margin-bottom:14px">Movement skills</span>';
  for(var s=0;s<SKILLS.length;s++){
    var sk=SKILLS[s];
    var lv=parseInt(localStorage.getItem('sk_'+sk.id)||'1');
    var open=S.skOpen===sk.id;
    var inner='';
    if(open){
      inner='<div style="margin-top:12px">';
      for(var l=0;l<sk.lvls.length;l++){
        var lvi=sk.lvls[l];
        inner+='<div style="padding:11px 12px;border-radius:10px;background:var(--bg3);margin-bottom:7px;display:flex;gap:11px;align-items:flex-start">';
        inner+='<div style="width:24px;height:24px;border-radius:6px;background:var(--str-bg);border:.5px solid var(--str-brd);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--acc);flex-shrink:0">'+(l+1)+'</div>';
        inner+='<div style="flex:1"><p style="font-size:13px;font-weight:500;color:var(--tx);margin-bottom:3px">'+lvi.n+'</p>';
        inner+='<p style="font-size:13px;color:var(--mu);line-height:1.5;margin-bottom:4px">'+lvi.d+'</p>';
        inner+='<p style="font-size:11px;color:var(--acc);font-style:italic">Ready when: '+lvi.t+'</p></div></div>';
      }
      inner+='</div>';
    }
    var rot=open?'180':'0';
    html+='<div class="card" style="margin-bottom:10px"><div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer" data-togglesk="'+sk.id+'">';
    html+='<div style="display:flex;align-items:center;gap:12px">';
    html+='<div style="width:38px;height:38px;border-radius:10px;background:var(--str-bg);border:.5px solid var(--str-brd);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--acc)">'+sk.ico+'</div>';
    html+='<div><p style="font-size:14px;font-weight:500;color:var(--tx)">'+sk.name+'</p><p class="mu">Level '+lv+' of '+sk.lvls.length+'</p></div></div>';
    html+='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--dim)" stroke-width="2" style="transform:rotate('+rot+'deg);transition:transform .2s;flex-shrink:0"><polyline points="6 9 12 15 18 9"/></svg>';
    html+='</div>'+inner+'</div>';
  }
  html+='</div></div>';
  return html;
}

  var n=new Date();var el=document.getElementById('clk');
  if(el)el.textContent=n.getHours()+':'+('0'+n.getMinutes()).slice(-2);
},15000);
</script>
