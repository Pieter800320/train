<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Falkenburg">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<title>Falkenburg</title>
<style>
:root{--bg:#111;--bg2:#1a1a1a;--bg3:#222;--acc:#E07B3A;--acc2:#3A82E0;--tx:#f0f0f0;--mu:#888;--dim:#444;--brd:#2a2a2a;--ok:#4aaa60;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif}
#app{max-width:430px;margin:0 auto;min-height:100vh}
.pad{padding:20px 16px 90px}
.lbl{font-size:10px;letter-spacing:.8px;color:var(--mu);text-transform:uppercase;font-weight:500}
.mu{font-size:13px;color:var(--mu);line-height:1.6}
.h1{font-size:22px;font-weight:500;line-height:1.3}
.h2{font-size:18px;font-weight:500}
.card{background:var(--bg2);border-radius:var(--r);padding:16px;border:.5px solid var(--brd)}
.cacc{border-left:3px solid var(--acc);border-radius:0 12px 12px 0;background:#160e00}
.cblu{border-left:3px solid var(--acc2);border-radius:0 12px 12px 0;background:#001422}
.btn{display:block;width:100%;padding:16px;border:none;border-radius:14px;font-size:15px;font-weight:500;cursor:pointer;text-align:center}
.btnp{background:var(--acc);color:#fff}
.btno{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.btng{background:transparent;border:none;color:var(--mu);cursor:pointer;width:100%;padding:12px;font-size:14px}
.pill{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:500}
.pgr{background:var(--bg3);color:var(--mu)}
.pac{background:#2a1400;color:var(--acc)}
.pbl{background:#001422;color:var(--acc2)}
.pok{background:#0a1e0a;color:var(--ok)}
#tb{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#161616;border-top:.5px solid var(--brd);display:grid;grid-template-columns:repeat(5,1fr);padding:10px 0 24px;z-index:100}
.ti{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--dim);padding:4px}
.ti.on{color:var(--acc)}
.ti svg{width:22px;height:22px}
.ti span{font-size:10px;font-weight:500}
.exrow{background:var(--bg2);border-radius:12px;padding:13px 14px;margin-bottom:7px;display:flex;align-items:center;gap:12px;border:.5px solid var(--brd);cursor:pointer}
.exstr{background:#1c1000;border-color:#3a1e00}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pb{background:var(--bg3);border-radius:4px;height:5px;overflow:hidden}
.pf{background:var(--acc);height:100%;border-radius:4px;transition:width .3s}
.opt{background:var(--bg2);border:1px solid var(--brd);border-radius:14px;padding:15px 18px;margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:14px}
.opt.sel{border-color:var(--acc);background:#1e1000}
.oico{width:36px;height:36px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--acc);flex-shrink:0}
.sp{width:24px;height:4px;border-radius:2px;background:var(--bg3)}
.sp.dn{background:var(--acc)}
.nb{background:var(--bg3);border:none;color:var(--tx);width:32px;height:32px;border-radius:8px;font-size:18px;cursor:pointer}
.cue{font-size:13px;color:var(--mu);padding:6px 10px;border-left:2px solid var(--brd);margin:4px 0;line-height:1.5}

/* Progress slide-down sheet */
#prog-sheet{
  position:fixed;top:0;left:50%;transform:translate(-50%,-100%);
  width:100%;max-width:430px;height:100vh;
  background:var(--bg);z-index:300;overflow-y:auto;
  transition:transform .35s cubic-bezier(.4,0,.2,1);
  box-shadow:0 8px 40px rgba(0,0,0,.4);
}
#prog-sheet.open{transform:translate(-50%,0);}
#drum-amrap::-webkit-scrollbar,#drum-cd::-webkit-scrollbar,#drum-emom::-webkit-scrollbar,#drum-work::-webkit-scrollbar,#drum-rest::-webkit-scrollbar,#drum-rounds::-webkit-scrollbar{display:none}
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:none;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity .2s}
#modal-overlay.show{opacity:1}
#modal-box{background:var(--bg2);border-radius:20px;padding:24px;width:100%;max-width:340px;border:.5px solid var(--brd);transform:scale(.95);transition:transform .2s}
#modal-overlay.show #modal-box{transform:scale(1)}
</style>
</head>
<body>
<div id="modal-overlay" onclick="if(event.target===this)modalCancel()">
  <div id="modal-box">
    <p id="modal-title" style="font-size:17px;font-weight:600;color:var(--tx);margin-bottom:8px"></p>
    <p id="modal-msg" style="font-size:14px;color:var(--mu);line-height:1.5;margin-bottom:22px"></p>
    <div style="display:flex;gap:10px">
      <button onclick="modalCancel()" style="flex:1;padding:13px;border-radius:12px;border:1px solid var(--brd);background:transparent;color:var(--tx);font-size:15px;cursor:pointer">Cancel</button>
      <button id="modal-confirm-btn" onclick="modalConfirm()" style="flex:1;padding:13px;border-radius:12px;border:1px solid var(--brd);background:var(--acc);color:#fff;font-size:15px;font-weight:500;cursor:pointer">Confirm</button>
    </div>
  </div>
</div>
<div id="app">
  <div style="background:var(--bg);padding:12px 20px 6px;display:flex;justify-content:space-between;align-items:center">
    <span id="clk" style="font-size:11px;color:var(--mu);font-weight:500">9:41</span>
    <span style="font-size:13px;font-weight:700;letter-spacing:2.5px;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;text-transform:uppercase;opacity:.9">Falkenburg</span>
    <button onclick="openProgress()" style="background:var(--bg3);border:none;color:var(--tx);height:28px;padding:0 10px;border-radius:14px;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.5px">LOG</button>
  </div>
  <div id="scr"></div>
  <nav id="tb" style="display:none">
    <div class="ti" id="t-home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg><span>Home</span></div>
    <div class="ti" id="t-today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="5 3 19 12 5 21 5 3"/></svg><span>Today</span></div>
    <div class="ti" id="t-programs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Programs</span></div>
    <div class="ti" id="t-build"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>Build</span></div>
    <div class="ti" id="t-timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="13" r="8"/><polyline points="12 9 12 13 15 15"/><path d="M9 2h6"/><path d="M12 2v3"/></svg><span>Timer</span></div>
  </nav>
</div>
<script>

  {type:'notice',title:'Welcome to Falkenburg!',body:'Your personal coaching app. Tap Today to see your first session.'},

  {type:'notice',title:'Questions about your program?',body:'Message your coach directly — they are here to help.'}
];

function fetchInfo(){
  if(!INFO_URL||INFO_URL==='YOUR_SCRIPT_URL_HERE')return;
  fetch(INFO_URL)
    .then(function(r){return r.json();})
    .then(function(data){
      if(Array.isArray(data)&&data.length>0){
        INFO=data;
        if(S.view==='app'&&S.tab==='home'&&!S.wx)draw();
      }
    })
    .catch(function(e){console.log('Info board offline, using defaults');});
}

var PH={
  primer:{label:'Warm-up'},
  strength:{label:'Strength'},
  accessory:{label:'Accessory'},
  cooldown:{label:'Cooldown'}
};
// Returns display label for any category key (built-in or custom)
function phLabel(ph){
  if(!ph)return 'Strength';
  if(PH[ph])return PH[ph].label;
  return ph; // custom category — use as-is
}
// Generates a vol display string from exercise fields
function exVolStr(ex){
  if(!ex)return '';
  // Built-in exercises already have a vol string and no sets/reps structured fields as numbers
  if(ex.vol&&typeof ex.sets==='undefined')return ex.vol;
  var s=ex.sets||1;
  var parts=[];
  if(ex.time&&ex.time>0){parts.push(s+' × '+fmt(ex.time));}
  else if(ex.reps&&ex.reps>0){parts.push(s+' × '+ex.reps);}
  else{parts.push(s+' set'+(s>1?'s':''));}
  if(ex.rest&&ex.rest>0)parts.push('rest '+fmt(ex.rest));
  return parts.join(' · ');
}

var TPL_HYP={name:'Hypertrophy',days:[{label:'Session A',focus:'Push — Chest, Shoulders, Triceps',mins:50,exercises:[

{id:'h_if',ph:'accessory',name:'Incline DB fly',vol:'3 x 12',rest:60,sets:3,reps:12,kg:8,muscles:'Chest — stretch emphasis, upper fibres',cues:['Slight bend in the elbows throughout — do not straighten them fully','Lower until you feel a deep chest stretch — do not force beyond comfort','Squeeze the chest to bring the dumbbells back up — think: hugging a tree'],subs:'Cable fly (low-to-high), pec deck machine',prog:'Add 2 kg when 3x12 is clean. Form over load always.'},

function getPlanByKey(k){for(var i=0;i<PLANS.length;i++)if(PLANS[i].key===k)return PLANS[i];return null;}
function getActivePlan(){if(!S.plan||!S.plan.key)return null;return getPlanByKey(S.plan.key);}
function getPlanWeek(){
  var p=getActivePlan();if(!p||!S.plan)return null;
  var w=S.plan.weekIdx||0;
  if(p.cyclic)w=w%p.weeks.length;else w=Math.min(w,p.weeks.length-1);
  return p.weeks[w];
}
function getPlanWeekNum(){
  var p=getActivePlan();if(!p||!S.plan)return 1;
  var w=S.plan.weekIdx||0;
  if(p.cyclic)return(w%p.weeks.length)+1;
  return Math.min(w,p.weeks.length-1)+1;
}
function attachPlan(planKey){
  var p=getPlanByKey(planKey);if(!p)return;
  S.plan={key:planKey,weekIdx:0,weekStart:new Date().toISOString(),sessionsThisWeek:0,notified:false};
  sv();draw();
}
function detachPlan(){S.plan=null;sv();draw();}
function advancePlanWeek(){
  if(!S.plan)return;
  S.plan.weekIdx=(S.plan.weekIdx||0)+1;
  S.plan.sessionsThisWeek=0;
  S.plan.weekStart=new Date().toISOString();
  S.plan.notified=false;
  sv();draw();
}
function checkPlanAdvance(){
  if(!S.plan||!S.plan.weekStart)return false;
  var diff=(new Date()-new Date(S.plan.weekStart))/(1000*60*60*24);
  return diff>=7&&!S.plan.notified;
}

function getRecommendations(ans){
  var g=ans.goal||'general',sp=ans.sport||'none',inj=ans.injury||'none',exp=ans.exp||'new';
  var lv=ans.level||'beginner',days=ans.days||'3';
  var sc={};
  CATALOGUE.forEach(function(c){
    if(!c.available)return;
    var s=0;
    if(g==='muscle'){
      if(c.goal==='muscle'&&c.level===lv&&c.days===days)s+=80;
      else if(c.goal==='muscle'&&c.level===lv)s+=40;
      else if(c.goal==='muscle')s+=20;
      else if(c.key==='strength')s+=10;
      else if(c.key==='balanced')s+=8;
    } else if(g==='strength'){
      if(c.goal==='strength'&&c.level===lv&&c.days===days)s+=80;
      else if(c.goal==='strength'&&c.level===lv)s+=40;
      else if(c.goal==='strength')s+=20;
      else if(c.goal==='muscle')s+=8;
      else if(c.key==='balanced')s+=8;
    } else if(g==='endurance'){
      if(c.goal==='endurance'&&c.level===lv&&c.days===days)s+=80;
      else if(c.goal==='endurance'&&c.level===lv)s+=40;
      else if(c.goal==='endurance')s+=20;
      else if(c.key==='fatloss')s+=15;
    } else if(g==='fat_loss'){
      if(c.key==='fatloss')s+=50;
      else if(c.goal==='endurance')s+=15;
      else if(c.key==='balanced')s+=15;
    } else if(g==='balanced'||g==='general'){
      if(c.key==='balanced')s+=50;
      else if(c.key==='fatloss')s+=15;
      else if(c.goal==='strength'&&c.level===lv&&c.days===days)s+=20;
      else if(c.goal==='muscle'&&c.level===lv&&c.days===days)s+=15;
    } else if(g==='athletic'){
      if(['athletic','soccer','run','court','climb'].indexOf(c.key)>=0)s+=35;
      else if(c.key==='balanced')s+=10;
    }
    if(sp==='soccer'){if(c.key==='soccer')s+=50;else if(c.key==='athletic')s+=15;}
    else if(sp==='run'){if(c.key==='run')s+=50;else if(c.key==='athletic')s+=15;}
    else if(sp==='court'){if(c.key==='court')s+=50;else if(c.key==='athletic')s+=15;}
    else if(sp==='other'){if(c.key==='athletic')s+=30;else if(c.key==='climb')s+=25;}
    if(inj==='shoulder')s+=(c.key==='shoulder'?60:(['back','knee'].indexOf(c.key)>=0?5:0));
    else if(inj==='knee')s+=(c.key==='knee'?60:(c.key==='back'?5:0));
    else if(inj==='back')s+=(c.key==='back'?60:0);
    if(inj==='none'&&['shoulder','knee','back'].indexOf(c.key)>=0)s-=30;
    if(exp==='new'){if(c.key==='balanced')s+=15;if(['hyp','strength','athletic'].indexOf(c.key)>=0)s-=10;}
    if(c.key==='home_bw'||c.key==='home_db'){if(exp==='new')s+=10;if(g==='general')s+=10;}
    if(s>0)sc[c.key]=(sc[c.key]||0)+s;
  });
  return Object.keys(sc).sort(function(a,b){return sc[b]-sc[a];}).slice(0,3);
}

// WORKOUT PLAYER -------------------------------------------------------------

function wxStart(){
  // FIX: use ACTIVE_TPL
  var exs=[];
  var sess=ACTIVE_TPL.days[S.day];
  for(var i=0;i<sess.exercises.length;i++){
    var e=sess.exercises[i];
    // Built-in exercises: include only those with sets>0 (skips primer/cooldown with sets=undefined/0).
    // Custom exercises always have sets (set in the form), so include them directly.
    if(e.category){
      // Custom exercise — always include, ensure defaults
      if(e)exs.push(Object.assign({sets:1,reps:0,rest:0,kg:0,time:0},e));
    } else if(e.sets){
      // Built-in exercise with sets defined — include
      exs.push(e);
    }
    // else: built-in primer/cooldown (no sets) — skip
  }
  var weights={},reps={},times={};
  for(var i=0;i<exs.length;i++){
    var eid=exs[i].id;
    var pr=S.pr[eid]||{};
    // Load weight: prefer flat pr.kg (auto-saved), fall back to last entry, then TPL default
    var lastEntry=pr.entries&&pr.entries.length?pr.entries[pr.entries.length-1]:null;
    weights[eid]=pr.kg!==undefined?pr.kg:(lastEntry?lastEntry.kg:(exs[i].kg||0));
    reps[eid]=pr.reps!==undefined?pr.reps:(lastEntry?lastEntry.reps:(exs[i].reps||0));
    times[eid]=pr.time!==undefined?pr.time:(exs[i].time||0);
  }
  S.wx={on:true,label:sess.label,exs:exs,idx:0,set:1,logs:[],rest:false,rl:0,rt:0,weights:weights,reps:reps,times:times,exTimer:0,exTimerRunning:false};
  sv();
  try{draw();}catch(err){
    console.error('wxV crash:',err);
    var sc=document.getElementById('scr');
    if(sc)sc.innerHTML='<div class="pad"><p class="h2" style="color:var(--warn)">Session error</p><p class="mu" style="margin-top:8px">'+err.message+'</p><button class="btn btno" style="margin-top:16px" onclick="S.wx=null;sv();go(\'today\')">Back to Today</button></div>';
  }
}

var _t=null;
function tickR(){
  clearInterval(_t);
  if(!S.wx)return;
  if(!S.wx.rest&&!S.wx.exTimerRunning)return;
  _t=setInterval(function(){
    if(!S.wx){clearInterval(_t);return;}
    // Rest timer
    if(S.wx.rest){
      S.wx.rl=Math.max(0,S.wx.rl-1);
      var te=document.getElementById('rt');
      if(te)te.textContent=fmt(S.wx.rl);
      var re=document.getElementById('rr');
      if(re)re.style.strokeDashoffset=440-(440*(1-S.wx.rl/S.wx.rt));
      if(S.wx.rl<=0){S.wx.rest=false;sv();clearInterval(_t);draw();}
    }
    // Exercise timer
    if(S.wx.exTimerRunning){
      S.wx.exTimer=Math.max(0,S.wx.exTimer-1);
      var et=document.getElementById('ext');
      if(et)et.textContent=fmt(S.wx.exTimer);
      var er=document.getElementById('exr');
      var ex=S.wx.exs[S.wx.idx];
      var tFullTick=S.wx.times[ex.id]||ex.time||0;
      if(er&&ex&&tFullTick)er.style.strokeDashoffset=440-(440*(S.wx.exTimer/tFullTick));
      if(S.wx.exTimer<=0){
        S.wx.exTimerRunning=false;
        try{beep(880,400);}catch(e){}
        sv();
        // Re-render to update button state
        var sc=document.getElementById('scr');
        if(sc)sc.innerHTML=wxV();
        tickR();
        return;
      }
    }
  },1000);
}
function wxExTimerStart(){
  var ex=S.wx.exs[S.wx.idx];

  sv();
  var sc=document.getElementById('scr');if(sc)sc.innerHTML=wxV();

function adjW(d){
  var ex=S.wx.exs[S.wx.idx];
  S.wx.weights[ex.id]=Math.max(0,Math.round((S.wx.weights[ex.id]+d)*10)/10);
  var el=document.getElementById('wd');
  if(el)el.textContent=S.wx.weights[ex.id];
}
function adjR(d){
  var ex=S.wx.exs[S.wx.idx];
  if(!S.wx.reps)S.wx.reps={};
  if(S.wx.reps[ex.id]===undefined)S.wx.reps[ex.id]=ex.reps||0;
  S.wx.reps[ex.id]=Math.min(50,Math.max(1,S.wx.reps[ex.id]+d));
  var el=document.getElementById('rd');
  if(el)el.textContent=S.wx.reps[ex.id];
}
function adjT(d){
  var ex=S.wx.exs[S.wx.idx];
  if(!S.wx.times)S.wx.times={};
  if(S.wx.times[ex.id]===undefined)S.wx.times[ex.id]=ex.time||0;
  S.wx.times[ex.id]=Math.max(10,S.wx.times[ex.id]+d);
  // Reset the running timer to the new value
  S.wx.exTimerRunning=false;
  S.wx.exTimer=S.wx.times[ex.id];
  clearInterval(_t);
  var sc=document.getElementById('scr');if(sc)sc.innerHTML=wxV();
}
function wxLog(){
  var w=S.wx;var ex=w.exs[w.idx];
  if(!w.reps)w.reps={};
  if(!w.times)w.times={};
  var eid=ex.id;
  // Stop exercise timer and clear note edit state
  w.exTimerRunning=false;
  w.editingNotes=null;
  w.noteDraft='';
  w.exTimer=0;
  w.logs.push({name:ex.name,set:w.set,reps:w.reps[eid],kg:w.weights[eid]});
  // ── Auto-persist weight and reps to S.pr so next session pre-fills ────────
  if(!S.pr)S.pr={};
  if(!S.pr[eid])S.pr[eid]={name:ex.name,entries:[]};
  S.pr[eid].name=ex.name;
  if(w.weights[eid]!==undefined)S.pr[eid].kg=w.weights[eid];
  if(w.reps[eid]!==undefined)S.pr[eid].reps=w.reps[eid];
  // ─────────────────────────────────────────────────────────────────────────
  if(w.set<ex.sets){
    w.set++;
    if(ex.time>0||w.times[eid]>0)w.exTimer=0;
    if(ex.rest>0){w.rest=true;w.rl=ex.rest;w.rt=ex.rest;}
  } else {
    w.idx++;w.set=1;
    if(w.idx<w.exs.length&&w.exs[w.idx].rest>0){w.rest=true;w.rl=w.exs[w.idx].rest;w.rt=w.exs[w.idx].rest;}
  }
  sv();draw();
}
function wxAddPB(){
  if(!S.pr)S.pr={};
  var w=S.wx;var ex=w.exs[w.idx];
  if(!w.reps)w.reps={};if(!w.times)w.times={};
  var eid=ex.id;
  var mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var d=new Date();
  var dateStr=d.getDate()+' '+mn[d.getMonth()]+' '+d.getFullYear();
  if(!S.pr[eid])S.pr[eid]={name:ex.name,entries:[]};
  if(!S.pr[eid].entries)S.pr[eid].entries=[];
  S.pr[eid].name=ex.name;
  S.pr[eid].entries.push({date:dateStr,kg:w.weights[eid]||0,reps:w.reps[eid]||0});
  sv();
  // Flash confirmation
  var btn=document.getElementById('pb-btn');
  if(btn){btn.textContent='✓ Saved!';btn.style.color='var(--ok)';setTimeout(function(){if(btn){btn.textContent='★ Personal best';btn.style.color='var(--mu)';}},1500);}
}
function wxEditNote(){
  var ex=S.wx.exs[S.wx.idx];
  S.wx.editingNotes=ex.id;
  S.wx.noteDraft=ex.notes||'';
  var sc=document.getElementById('scr');if(sc)sc.innerHTML=wxV();
  // Focus textarea after render
  setTimeout(function(){var ta=document.getElementById('notes-edit');if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}},50);
}
function wxSaveNote(){
  var w=S.wx;
  var ex=w.exs[w.idx];
  var newNote=w.noteDraft||'';
  // Update the live exercise object in S.wx.exs
  ex.notes=newNote;
  // Persist back to the program: find the exercise by id in ACTIVE_TPL or customPrograms
  var updated=false;
  // Search ACTIVE_TPL days
  for(var di=0;di<ACTIVE_TPL.days.length&&!updated;di++){
    for(var ei=0;ei<ACTIVE_TPL.days[di].exercises.length&&!updated;ei++){
      if(ACTIVE_TPL.days[di].exercises[ei].id===ex.id){
        ACTIVE_TPL.days[di].exercises[ei].notes=newNote;
        updated=true;
      }
    }
  }
  // Also search customPrograms in case ACTIVE_TPL is a custom one
  if(S.customPrograms){
    for(var ci=0;ci<S.customPrograms.length&&!updated;ci++){
      var cp=S.customPrograms[ci];
      if(!cp.tpl)continue;
      for(var di=0;di<cp.tpl.days.length&&!updated;di++){
        for(var ei=0;ei<cp.tpl.days[di].exercises.length&&!updated;ei++){
          if(cp.tpl.days[di].exercises[ei].id===ex.id){
            cp.tpl.days[di].exercises[ei].notes=newNote;
            updated=true;
          }
        }
      }
    }
  }
  w.editingNotes=null;
  w.noteDraft='';
  sv();
  var sc=document.getElementById('scr');if(sc)sc.innerHTML=wxV();
}
function wxSkip(){S.wx.rest=false;sv();draw();}
function wxConfirmEnd(){showModal('End session?','Your progress so far will be saved.','End session',wxEnd,true);}
function wxEnd(){
  // FIX: use ACTIVE_TPL for day cycling

    S.hist.push({date:new Date().toISOString(),label:S.wx.label,logs:S.wx.logs});
    S.day=(S.day+1)%ACTIVE_TPL.days.length;
  }
  clearInterval(_t);S.wx=null;S.tab='home';sv();draw();
}

document.addEventListener('click',function(e){
  var t=e.target;
  while(t&&t!==document.body){
    if(t.dataset&&t.dataset.key&&t.dataset.val!==undefined){
      S.ob.ans[t.dataset.key]=t.dataset.val;draw();return;
    }
    if(t.dataset&&t.dataset.xd!==undefined){
      var el=document.getElementById('xd'+t.dataset.xd);
      if(el)el.style.display=el.style.display==='none'?'block':'none';
      return;
    }
    if(t.dataset&&t.dataset.histtoggle!==undefined){
      var el=document.getElementById('hist'+t.dataset.histtoggle);
      if(el)el.style.display=el.style.display==='none'?'block':'none';
      return;
    }
    if(t.dataset&&t.dataset.switchday!==undefined){
      S.day=parseInt(t.dataset.switchday);sv();draw();return;
    }
    if(t.dataset&&t.dataset.custdays){var ne=document.getElementById('cpname');if(ne&&ne.value.trim())S.customEdit.name=ne.value.trim();S.customEdit.numDays=parseInt(t.dataset.custdays);sv();draw();return;}
    if(t.dataset&&t.dataset.delex){var parts=t.dataset.delex.split('-');custDelEx(parseInt(parts[0]),parseInt(parts[1]));return;}
    if(t.dataset&&t.dataset.delcp){
      var cpkey=t.dataset.delcp,cpname=t.dataset.delname||'this program';
      showModal('Delete program?',cpname+' will be permanently removed.','Delete',function(){
      for(var dci=0;dci<S.customPrograms.length;dci++)if(S.customPrograms[dci].key===cpkey){S.customPrograms.splice(dci,1);break;}
      if(S.tplKey===cpkey){S.tplKey='balanced';ACTIVE_TPL=TPL;}
      sv();draw();
      },true);return;
    }
    if(t.dataset&&t.dataset.delprog){
      var dpkey=t.dataset.delprog;
      showModal('Delete program?','This custom program will be permanently removed.','Delete',function(){
      for(var dpi=0;dpi<S.customPrograms.length;dpi++)if(S.customPrograms[dpi].key===dpkey){S.customPrograms.splice(dpi,1);break;}
      if(S.tplKey===dpkey){S.tplKey='balanced';ACTIVE_TPL=TPL;}
      sv();draw();
      },true);return;
    }
    if(t.dataset&&t.dataset.tset){S.timer.totalSecs=parseInt(t.dataset.tset);sv();draw();return;}
    if(t.dataset&&t.dataset.timermode){S.timer.mode=t.dataset.timermode;S.timer.setup=true;S.timer.running=false;clearInterval(_timerInterval);sv();draw();return;}
    if(t.dataset&&t.dataset.switchprog){switchProgram(t.dataset.switchprog);return;}
    if(t.dataset&&t.dataset.attachplan){attachPlan(t.dataset.attachplan);return;}
    // Walk up DOM tree to find pgopen - but NOT if a button was clicked
    var pgEl=null;
    if(e.target.tagName!=='BUTTON'&&e.target.tagName!=='INPUT'){
      pgEl=e.target;
      while(pgEl&&!pgEl.dataset.pgopen)pgEl=pgEl.parentElement;
    }
    if(pgEl&&pgEl.dataset&&pgEl.dataset.pgopen){
      if(!S._pgOpen)S._pgOpen={};
      S._pgOpen[pgEl.dataset.pgopen]=!S._pgOpen[pgEl.dataset.pgopen];
      sv();draw();return;
    }
    if(t.dataset&&t.dataset.selectprog){obSelectProgram(t.dataset.selectprog);return;}
    if(t.dataset&&t.dataset.action==='goprograms'){S.view='app';S.tab='programs';sv();draw();return;}
    if(t.id&&t.id.indexOf('t-')===0){go(t.id.slice(2));return;}
    t=t.parentElement;
  }
});

function switchProgram(key){
  var m=tplMap();
  // Check custom programs
  if(key.indexOf('custom_')===0){
    var cp=m[key];
    if(!cp)return;
    if(S.tplKey===key){go('today');return;}
    var cpName='this program';
    for(var i=0;i<S.customPrograms.length;i++)if(S.customPrograms[i].key===key)cpName=S.customPrograms[i].name;
    showModal('Switch program?','Switch to '+cpName+'? Your session history is kept.','Switch',function(){S.tplKey=key;ACTIVE_TPL=cp;S.day=0;sv();go('today');});return;
  }
  var entry=null;for(var i=0;i<CATALOGUE.length;i++)if(CATALOGUE[i].key===key)entry=CATALOGUE[i];
  if(!entry||!entry.available)return;
  if(!m[key])return;
  if(S.tplKey===key){go('today');return;}
  showModal('Switch program?','Switch to '+entry.name+'? Your session history is kept.','Switch',function(){S.tplKey=key;ACTIVE_TPL=m[key];S.day=0;sv();go('today');});
}

function resetOnboarding(){
  S.ob={step:0,ans:{},recs:[]};S.view='ob';sv();draw();
}

function custStart(){
  var days=[];
  var labels=['Session A','Session B','Session C','Session D','Session E'];
  for(var i=0;i<S.customEdit.numDays;i++){
    days.push({label:labels[i],exercises:[]});
  }
  S.customEdit.days=days;
  S.customEdit.activeDay=0;
  S.customEdit.newEx=null;
  sv();draw();
}
function custOpenEx(){S.customEdit.newEx={name:'',category:'Strength',sets:3,reps:10,time:0,rest:0,notes:''};sv();draw();}
function custSetCat(cv){
  if(cv==='Custom'){S.customEdit.newEx.customCat='';S.customEdit.newEx.category='Custom';}
  else{S.customEdit.newEx.category=cv;delete S.customEdit.newEx.customCat;}
  sv();draw();
}
function custAddEx(){
  var ne=S.customEdit.newEx;
  if(!ne||!ne.name.trim())return;
  ne.id='custom_ex_'+Date.now();
  // Resolve category: custom free-type or preset
  if(ne.customCat!==undefined)ne.category=ne.customCat||'Custom';
  delete ne.customCat;
  // ph maps to built-in key for compatibility, falls back to category string
  ne.ph=ne.category;
  // vol auto-generated for display
  ne.vol=exVolStr(ne);
  S.customEdit.days[S.customEdit.activeDay].exercises.push(ne);
  S.customEdit.newEx=null;
  sv();draw();
}
function custCancelEx(){S.customEdit.newEx=null;sv();draw();}
function custDelEx(dayIdx,exIdx){
  S.customEdit.days[dayIdx].exercises.splice(exIdx,1);sv();draw();
}
function custSave(){
  var ce=S.customEdit;
  var key='custom_'+Date.now();
  var tpl={name:ce.name,days:ce.days};
  var mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var d=new Date();
  var dateStr=d.getDate()+' '+mn[d.getMonth()];
  if(!S.customPrograms)S.customPrograms=[];
if(!S.pr)S.pr={};
if(!S.histPage)S.histPage=0;
// Patch stale wx state from pre-PR-system sessions
if(S.wx){
  if(!S.wx.reps)S.wx.reps={};
  if(!S.wx.times)S.wx.times={};
  if(!S.wx.weights)S.wx.weights={};
}
  S.customPrograms.push({key:key,name:ce.name,date:dateStr,tpl:tpl});
  S.tplKey=key;
  ACTIVE_TPL=tpl;
  S.day=0;
  S.customEdit={name:'My Program',numDays:3,days:[],activeDay:null,newEx:null};
  sv();go('today');
}

var _timerInterval=null;

// ── STOPWATCH (always-on at top of Timer tab) ────────────────────────────────
var _sw={running:false,elapsed:0};
var _swInterval=null;
function swToggle(){
  if(_sw.running){
    clearInterval(_swInterval);_sw.running=false;
    var el=document.getElementById('sw-display');if(el)el.style.color='var(--tx)';
    var el2=document.getElementById('sw-tile-display');if(el2)el2.style.color='var(--tx)';
    var btn=document.getElementById('sw-btn');if(btn){btn.textContent='Start';btn.className='btn btnp';btn.style.flex='1';}
  } else {
    _sw.running=true;
    var el=document.getElementById('sw-display');if(el)el.style.color='var(--acc)';
    var btn=document.getElementById('sw-btn');if(btn){btn.textContent='Pause';btn.className='btn btno';btn.style.flex='1';}
    _swInterval=setInterval(function(){
      _sw.elapsed++;
      var el=document.getElementById('sw-display');
      if(el)el.textContent=fmt(_sw.elapsed);
      var el2=document.getElementById('sw-tile-display');
      if(el2)el2.textContent=fmt(_sw.elapsed);
    },1000);
  }
}
function swReset(){

// ── timerV ────────────────────────────────────────────────────────────────────
function timerV(){
  var T=S.timer;
  if(T.setup){return timerSetupV();}
  var mode=T.mode;
  if(mode==='countdown'){
    var elapsed=T.elapsed,total=T.totalSecs,remaining=T.remaining;
    var pct=Math.min(100,(total-remaining)/total*100);
    var timeDisplay=fmt(remaining);
    return '<div class="pad" style="padding-top:16px">'+'<div style="text-align:center;margin-bottom:28px"><span class="lbl">'+'Countdown — '+fmtTimer(total)+'</span></div>'
      +'<div class="pb" style="height:8px;margin-bottom:28px"><div class="pf" style="width:'+pct+'%;background:'+(T.running?'var(--acc)':'var(--mu)')+'"></div></div>'
      +'<div style="text-align:center;margin-bottom:36px"><p style="font-size:72px;font-weight:300;color:'+(T.running?'var(--acc)':'var(--tx)')+';font-variant-numeric:tabular-nums;letter-spacing:-2px">'+timeDisplay+'</p></div>'
      +'<div style="display:flex;gap:10px"><button class="btn '+(T.running?'btno':'btnp')+'" onclick="timerToggle()">'+(T.running?'Pause':'Start')+'</button><button class="btn btno" onclick="timerReset()">Reset</button></div>'
      +'<button class="btng" onclick="S.timer.setup=true;clearInterval(_timerInterval);sv();draw()">&#8592; Change timer</button>'
    +'</div>';
  }
  if(mode==='tabata'){
    var phase=T.tabPhase,timeLeft=T.remaining,roundNum=T.tabCurrent+1,totalRounds=T.tabRounds;
    var pct2=Math.min(100,(1-timeLeft/(phase==='work'?T.tabWork:T.tabRest))*100);
    return '<div class="pad" style="padding-top:16px">'+'<div style="text-align:center;margin-bottom:20px"><span class="lbl">TABATA · Round '+roundNum+' of '+totalRounds+'</span></div>'
      +'<div style="text-align:center;margin-bottom:12px"><p style="font-size:20px;font-weight:500;color:'+(phase==='work'?'var(--acc)':'var(--tx)')+';margin-bottom:12px">'+(phase==='work'?'WORK':'REST')+'</p></div>'
      +'<div class="pb" style="height:8px;margin-bottom:28px"><div class="pf" style="width:'+pct2+'%;background:'+(phase==='work'?'var(--acc)':'var(--mu)')+'"></div></div>'
      +'<div style="text-align:center;margin-bottom:36px"><p style="font-size:72px;font-weight:300;color:'+(T.running?'var(--acc)':'var(--tx)')+';font-variant-numeric:tabular-nums;letter-spacing:-2px">'+fmt(timeLeft)+'</p></div>'
      +'<div style="display:flex;gap:10px"><button class="btn '+(T.running?'btno':'btnp')+'" onclick="timerToggle()">'+(T.running?'Pause':'Start')+'</button><button class="btn btno" onclick="timerReset()">Reset</button></div>'
      +'<button class="btng" onclick="S.timer.setup=true;clearInterval(_timerInterval);sv();draw()">&#8592; Change timer</button>'
    +'</div>';
  }
  if(mode==='emom'){
    var displayRound=T.running||T.emomRound>0?T.emomRound:0;
    var minsLeft=T.emomMins-(displayRound);
    var roundLine=displayRound>0
      ?'Round '+displayRound+' of '+T.emomMins+' · '+minsLeft+' minute'+(minsLeft===1?'':'s')+' remaining'
      :'Ready — '+T.emomMins+' rounds';
    return '<div class="pad" style="padding-top:16px">'+'<div style="text-align:center;margin-bottom:8px"><span class="lbl">EMOM</span></div>'
      +'<div style="text-align:center;margin-bottom:28px"><p style="font-size:72px;font-weight:300;color:'+(T.running?'var(--acc)':'var(--tx)')+';font-variant-numeric:tabular-nums;letter-spacing:-2px">'+fmt(T.remaining)+'</p></div>'
      +'<p style="text-align:center;font-size:14px;color:var(--mu);margin-bottom:28px">'+roundLine+'</p>'
      +'<div style="display:flex;gap:10px"><button class="btn '+(T.running?'btno':'btnp')+'" onclick="timerToggle()">'+(T.running?'Pause':'Start')+'</button><button class="btn btno" onclick="timerReset()">Reset</button></div>'
      +'<button class="btng" onclick="S.timer.setup=true;clearInterval(_timerInterval);sv();draw()">&#8592; Change timer</button>'
    +'</div>';
  }
  if(mode==='stopwatch'){
    return '<div class="pad" style="padding-top:24px">'
      +'<div style="text-align:center;margin-bottom:8px"><span class="lbl">Stopwatch</span></div>'
      +'<div style="text-align:center;margin-bottom:40px"><p id="sw-display" style="font-size:72px;font-weight:300;color:'+(_sw.running?'var(--acc)':'var(--tx)')+';font-variant-numeric:tabular-nums;letter-spacing:-2px">'+fmt(_sw.elapsed)+'</p></div>'
      +'<div style="display:flex;gap:10px"><button id="sw-btn" class="btn '+(_sw.running?'btno':'btnp')+'" style="flex:1" onclick="swToggle()">'+(_sw.running?'Pause':'Start')+'</button><button class="btn btno" style="flex:1" onclick="swReset()">Reset</button></div>'
      +'<button class="btng" onclick="S.timer.setup=true;sv();draw()">&#8592; Change timer</button>'
    +'</div>';
  }
  return timerSetupV();
}

// ── timerSetupV ───────────────────────────────────────────────────────────────
function timerSetupV(){
  var T=S.timer;
  var modes=[{k:'countdown',l:'Countdown',sub:'Count down'},{k:'emom',l:'EMOM',sub:'Every minute on the minute'},{k:'tabata',l:'Tabata',sub:'Work / Rest intervals'}];
  var modeHtml='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px">';
  for(var i=0;i<modes.length;i++){
    var m=modes[i];var on=(T.mode===m.k);
    modeHtml+='<div data-timermode="'+m.k+'" style="background:'+(on?'#1e1000':'var(--bg2)')+';border:1px solid '+(on?'var(--acc)':'var(--brd)')+';border-radius:12px;padding:12px;cursor:pointer"><p style="font-size:13px;font-weight:500;color:'+(on?'var(--acc)':'var(--tx)')+';margin-bottom:3px">'+m.l+'</p><p style="font-size:11px;color:var(--mu)">'+m.sub+'</p></div>';
  }
  modeHtml+='</div>';

  // ── Build drum items ──────────────────────────────────────────────────────
  var minItems=[];for(var mi=1;mi<=90;mi++)minItems.push({label:mi+' min',val:mi*60});
  var workItems=[];for(var wi=5;wi<=300;wi+=5)workItems.push({label:wi+'s',val:wi});
  var restItems=[];for(var ri=5;ri<=300;ri+=5)restItems.push({label:ri+'s',val:ri});
  var roundItems=[];for(var ro=1;ro<=30;ro++)roundItems.push({label:ro,val:ro});

  var configHtml='';
  if(T.mode==='countdown'){
    var cdTotalSecs=T.totalSecs||300;
    var cdMins=Math.floor(cdTotalSecs/60);
    var cdSecs=cdTotalSecs%60;
    // Minutes: 0-90, Seconds: 0,5,10...55
    var cdMinItems=[];for(var cmi=0;cmi<=90;cmi++)cdMinItems.push({label:cmi+'m',val:cmi});
    var cdSecItems=[];for(var csi=0;csi<=55;csi+=5)cdSecItems.push({label:csi+'s',val:csi});
    configHtml='<div class="card" style="margin-bottom:16px"><span class="lbl">Duration</span>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px">'
        +'<div><span class="lbl" style="display:block;margin-bottom:6px">Minutes</span>'+makeDrum('drum-cd-min',cdMinItems,cdMins)+'</div>'
        +'<div><span class="lbl" style="display:block;margin-bottom:6px">Seconds</span>'+makeDrum('drum-cd-sec',cdSecItems,cdSecs)+'</div>'
      +'</div>'
    +'</div>';
  } else if(T.mode==='emom'){
    var curMins=T.emomMins||10;
    configHtml='<div class="card" style="margin-bottom:16px"><span class="lbl">Duration (minutes = rounds)</span>'
      +makeDrum('drum-emom',minItems,curMins*60)
    +'</div>';
  } else if(T.mode==='tabata'){
    configHtml='<div class="card" style="margin-bottom:16px">'
      +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">'
        +'<div><span class="lbl" style="display:block;margin-bottom:6px">Work</span>'+makeDrum('drum-work',workItems,T.tabWork)+'</div>'
        +'<div><span class="lbl" style="display:block;margin-bottom:6px">Rest</span>'+makeDrum('drum-rest',restItems,T.tabRest)+'</div>'
        +'<div><span class="lbl" style="display:block;margin-bottom:6px">Rounds</span>'+makeDrum('drum-rounds',roundItems,T.tabRounds)+'</div>'
      +'</div>'
      +'<p class="mu" style="font-size:11px;margin-top:10px;text-align:center">Total: '+fmtTimer((T.tabWork+T.tabRest)*T.tabRounds)+'</p>'
    +'</div>';
  }

  // All 4 modes as equal tiles in a 2x2 grid
  var allModes=[{k:'stopwatch',l:'Stopwatch',sub:'Count up freely'}].concat(modes);
  var allTiles='';
  for(var i=0;i<allModes.length;i++){
    var m=allModes[i];var on=(T.mode===m.k);
    allTiles+='<div data-timermode="'+m.k+'" style="background:'+(on?'#1e1000':'var(--bg2)')+';border:1px solid '+(on?'var(--acc)':'var(--brd)')+';border-radius:12px;padding:12px;cursor:pointer"><p style="font-size:13px;font-weight:500;color:'+(on?'var(--acc)':'var(--tx)')+';margin-bottom:3px">'+m.l+'</p><p style="font-size:11px;color:var(--mu)">'+m.sub+'</p></div>';
  }
  var grid='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px">'+allTiles+'</div>';
  // Stopwatch has no config card — just a start button
  var actionBtn=T.mode==='stopwatch'
    ?'<button class="btn btnp" onclick="S.timer.setup=false;sv();draw()">Open stopwatch</button>'
    :'<button class="btn btnp" onclick="timerStart()">Start timer</button>';

  return '<div class="pad"><span class="lbl">Timer</span><p class="h1" style="margin:6px 0 18px">Choose a format</p>'
    +grid+(T.mode!=='stopwatch'?configHtml:'')
    +actionBtn
  +'</div>';
}

function fmtTimer(s){
  var m=Math.floor(s/60);return m>0?m+' min '+(s%60?s%60+'s':''):s+'s';
}

// ── Sounds ───────────────────────────────────────────────────────────────────
function beep(freq,dur,delay){
  try{
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    var o=ctx.createOscillator();var g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    var t0=ctx.currentTime+(delay||0)/1000;
    o.frequency.value=freq;g.gain.value=0.5;
    o.start(t0);o.stop(t0+dur/1000);
    g.gain.setValueAtTime(0.5,t0);
    g.gain.exponentialRampToValueAtTime(0.001,t0+dur/1000);
  } catch(e){}
}
function doubleBeep(){beep(880,80);beep(880,80,150);}

// ── Timer engine ─────────────────────────────────────────────────────────────
var _timerInterval=null;
function timerStart(){
  var T=S.timer;
  T.running=true;T.setup=false;
  if(T.mode==='countdown'){T.remaining=T.totalSecs;}
  else if(T.mode==='emom'){T.remaining=60;T.emomRound=0;}
  else if(T.mode==='tabata'){T.tabCurrent=0;T.tabPhase='work';T.remaining=T.tabWork;}
  sv();draw();
  clearInterval(_timerInterval);
  _timerInterval=setInterval(function(){
    var T=S.timer;if(!T.running)return;
    if(T.mode==='countdown'){
      T.remaining--;
      if(T.remaining===Math.floor(T.totalSecs/2))doubleBeep();
      if(T.remaining===3||T.remaining===2||T.remaining===1)beep(660,80);
      if(T.remaining<=0){clearInterval(_timerInterval);T.running=false;beep(880,500);sv();draw();return;}
    } else if(T.mode==='emom'){
      T.remaining--;
      if(T.remaining===Math.floor(60/2))doubleBeep();
      if(T.remaining===3||T.remaining===2||T.remaining===1)beep(660,80);
      if(T.remaining<=0){
        T.emomRound++;
        if(T.emomRound>=T.emomMins){clearInterval(_timerInterval);T.running=false;beep(880,600);sv();draw();return;}
        beep(440,120);T.remaining=60;
      }
    } else if(T.mode==='tabata'){
      T.remaining--;
      var phaseLen=T.tabPhase==='work'?T.tabWork:T.tabRest;
      if(T.remaining===Math.floor(phaseLen/2))doubleBeep();
      if(T.remaining===3||T.remaining===2||T.remaining===1)beep(660,80);
      if(T.remaining<=0){
        if(T.tabPhase==='work'){T.tabPhase='rest';T.remaining=T.tabRest;beep(440,200);}
        else{
          T.tabCurrent++;
          if(T.tabCurrent>=T.tabRounds){clearInterval(_timerInterval);T.running=false;beep(880,600);sv();draw();return;}
          T.tabPhase='work';T.remaining=T.tabWork;beep(660,200);
        }
      }
    }
    sv();
    var rt=document.getElementById('rt');
    if(rt)rt.textContent=fmt(T.remaining);
    var sc=document.getElementById('scr');
    if(sc&&S.tab==='timer'&&!T.setup)sc.innerHTML=timerV();
  },1000);
}

function timerToggle(){
  var T=S.timer;
  // If timer has finished (remaining<=0), treat as a fresh start instead of resume
  if(!T.running&&T.remaining<=0){
    timerStart();return;
  }
  T.running=!T.running;
  if(T.running){
    clearInterval(_timerInterval);
    _timerInterval=setInterval(function(){
      var T=S.timer;if(!T.running)return;
      if(T.mode==='emom'){
        T.remaining--;
        if(T.remaining<=0){T.emomRound++;if(T.emomRound>=T.emomMins){clearInterval(_timerInterval);T.running=false;beep(880,600);sv();draw();return;}beep(440,120);T.remaining=60;}
      }
      else{T.remaining--;if(T.remaining<=0){clearInterval(_timerInterval);T.running=false;beep(880,400);sv();draw();return;}}
      sv();
      var sc=document.getElementById('scr');
      if(sc&&S.tab==='timer'&&!T.setup)sc.innerHTML=timerV();
    },1000);
  } else {
    clearInterval(_timerInterval);
  }
  sv();draw();
}

function timerReset(){
  clearInterval(_timerInterval);
  var T=S.timer;
  T.running=false;T.elapsed=0;T.emomRound=0;
  T.tabCurrent=0;T.tabPhase='work';
  T.remaining=T.mode==='tabata'?T.tabWork:T.totalSecs;
  sv();draw();
}

function initDrumScroll(){
  var T=S.timer;
  // Map drum id -> {get initial index, on change}
  var drums={
    'drum-cd-min':{idx:Math.max(0,Math.floor(T.totalSecs/60)),step:1,onChange:function(v){
      var secs=T.totalSecs%60;T.totalSecs=Math.max(5,v*60+secs);
    }},
    'drum-cd-sec':{idx:Math.max(0,Math.round((T.totalSecs%60)/5)),step:5,onChange:function(v){
      var mins=Math.floor(T.totalSecs/60);T.totalSecs=Math.max(5,mins*60+v);
    }},
    'drum-emom': {idx:Math.max(0,(T.emomMins||10)-1),             step:60,onChange:function(v){T.emomMins=Math.round(v/60);}},
    'drum-work': {idx:Math.max(0,Math.round((T.tabWork-5)/5)),     step:5, onChange:function(v){T.tabWork=v;}},
    'drum-rest': {idx:Math.max(0,Math.round((T.tabRest-5)/5)),     step:5, onChange:function(v){T.tabRest=v;}},
    'drum-rounds':{idx:Math.max(0,T.tabRounds-1),                  step:1, onChange:function(v){T.tabRounds=v;}}
  };
  var ids=Object.keys(drums);
  for(var i=0;i<ids.length;i++){
    (function(id,cfg){
      var drum=document.getElementById(id);
      if(!drum)return;
      drum.scrollTop=cfg.idx*44;
      var debounce;
      drum.addEventListener('scroll',function(){
        clearTimeout(debounce);
        debounce=setTimeout(function(){
          var idx=Math.round(drum.scrollTop/44);
          idx=Math.max(0,idx);
          var val;
          if(id==='drum-rounds')val=idx+1;
          else if(id==='drum-work'||id==='drum-rest')val=(idx+1)*5;
          else if(id==='drum-cd-min')val=idx;
          else if(id==='drum-cd-sec')val=idx*5;
          else val=(idx+1)*60;
          cfg.onChange(val);sv();
        },150);
      });
    })(ids[i],drums[ids[i]]);
  }
}
