<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<title>Train</title>
<style>
:root{--bg:#111;--bg2:#1a1a1a;--bg3:#222;--acc:#E07B3A;--acc2:#3A82E0;--tx:#f0f0f0;--muted:#888;--dim:#444;--border:#2a2a2a;--ok:#4aaa60;--rad:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;font-size:16px}
#app{max-width:430px;margin:0 auto;min-height:100vh}
.screen{padding-bottom:80px}
.pad{padding:20px 16px}
.label{font-size:10px;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;font-weight:500}
.muted{font-size:13px;color:var(--muted);line-height:1.6}
.h1{font-size:22px;font-weight:500;color:var(--tx);line-height:1.3}
.h2{font-size:18px;font-weight:500;color:var(--tx)}
.card{background:var(--bg2);border-radius:var(--rad);padding:16px;border:.5px solid var(--border)}
.card-acc{border-left:3px solid var(--acc);border-radius:0 12px 12px 0;background:#160e00}
.card-blue{border-left:3px solid var(--acc2);border-radius:0 12px 12px 0;background:#001422}
.btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:15px;font-weight:500;cursor:pointer}
.btn-p{background:var(--acc);color:#fff}
.btn-o{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.btn-g{background:transparent;border:none;color:var(--muted);cursor:pointer}
.pill{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:500}
.p-gray{background:var(--bg3);color:var(--muted)}
.p-acc{background:#2a1400;color:var(--acc)}
.p-blue{background:#001422;color:var(--acc2)}
.p-ok{background:#0a1e0a;color:var(--ok)}
#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#161616;border-top:.5px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);padding:10px 0 20px;z-index:100}
.ti{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--dim);padding:4px}
.ti.on{color:var(--acc)}
.ti svg{width:22px;height:22px}
.ti span{font-size:10px;font-weight:500}
.ex-row{background:var(--bg2);border-radius:12px;padding:13px 14px;margin-bottom:7px;display:flex;align-items:center;gap:12px;border:.5px solid var(--border);cursor:pointer}
.ex-str{background:#1c1000;border-color:#3a1e00}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pbar{background:var(--bg3);border-radius:4px;height:5px;overflow:hidden}
.pfill{background:var(--acc);height:100%;border-radius:4px;transition:width .3s}
.ob-opt{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:15px 18px;margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:border-color .15s,background .15s}
.ob-opt.sel{border-color:var(--acc);background:#1e1000}
.ob-icon{width:36px;height:36px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.setpip{width:24px;height:4px;border-radius:2px;background:var(--bg3)}
.setpip.done{background:var(--acc)}
.num-btn{background:var(--bg3);border:none;color:var(--tx);width:32px;height:32px;border-radius:8px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cue{font-size:13px;color:var(--muted);padding:6px 10px;border-left:2px solid var(--border);margin:4px 0;line-height:1.5}
.sep{height:.5px;background:var(--border);margin:12px 0}
</style>
</head>
<body>
<div id="app">
  <div id="sbar" style="background:var(--bg);padding:12px 20px 6px;display:flex;justify-content:space-between;align-items:center">
    <span id="clk" style="font-size:11px;color:var(--muted);font-weight:500">9:41</span>
    <span style="font-size:12px;color:var(--muted);font-weight:500">Train</span>
    <span style="font-size:11px;color:var(--muted)">&#9679;&#9679;&#9679;</span>
  </div>
  <div id="scr"></div>
  <nav id="tabbar" style="display:none">
    <div class="ti" data-t="home" onclick="go('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      <span>Home</span>
    </div>
    <div class="ti" data-t="today" onclick="go('today')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <span>Today</span>
    </div>
    <div class="ti" data-t="skills" onclick="go('skills')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      <span>Skills</span>
    </div>
    <div class="ti" data-t="progress" onclick="go('progress')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>Progress</span>
    </div>
  </nav>
</div>

<script>
// ── DATA ────────────────────────────────────────────────────────────────────

// ── STATE ────────────────────────────────────────────────────────────────────

let S={view:'ob',tab:'home',day:0,ob:{step:0,ans:{}},wx:null,hist:[],skillsOpen:null};

function ld(){try{const d=localStorage.getItem('train');if(d)Object.assign(S,JSON.parse(d));}catch(e){}}
function sv(){try{localStorage.setItem('train',JSON.stringify(S));}catch(e){}}

// ── ROUTER ───────────────────────────────────────────────────────────────────

function go(tab){S.tab=tab;sv();draw();}

function draw(){
  const sc=document.getElementById('scr');
  const tb=document.getElementById('tabbar');
  if(S.view==='ob'){tb.style.display='none';sc.innerHTML=obView();return;}
  if(S.wx&&S.wx.on){tb.style.display='none';sc.innerHTML=wxView();tickRest();return;}
  tb.style.display='grid';
  document.querySelectorAll('.ti').forEach(t=>t.classList.toggle('on',t.dataset.t===S.tab));
  sc.innerHTML={home:homeView,today:todayView,skills:skillsView,progress:progressView}[S.tab]();
}

// ── ONBOARDING ───────────────────────────────────────────────────────────────

function obView(){
  const step=S.ob.step;
  if(step>=OBQ.length){
    return`<div class="pad screen">
      <div style="margin-bottom:8px"><span class="label">Almost done</span></div>
      <p class="h1" style="margin-bottom:8px">Your program is ready.</p>
      <p class="muted" style="margin-bottom:28px">Based on your answers we've assigned Balanced Strength 3×/week — a full-body approach that builds strength, corrects imbalances, and teaches you to move well.</p>
      <div class="card" style="margin-bottom:10px">
        <span class="label">Your program</span>
        <p class="h2" style="margin:6px 0 3px">Balanced Strength</p>
        <p class="muted">3 sessions per week · Full body · ~45 min</p>
      </div>
      <div class="card" style="margin-bottom:28px">
        <span class="label">Your profile</span>
        ${Object.entries(S.ob.ans).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:.5px solid var(--border)"><span class="muted">${k}</span><span style="font-size:14px">${v}</span></div>`).join('')}
      </div>
      <button class="btn btn-p" onclick="obDone()">Start training →</button>
    </div>`;
  }
  const q=OBQ[step];
  const pct=(step/OBQ.length*100).toFixed(0);
  return`<div class="pad screen">
    <div class="pbar" style="margin-bottom:20px"><div class="pfill" style="width:${pct}%"></div></div>
    <span class="label">Question ${step+1} of ${OBQ.length}</span>
    <p style="font-size:20px;font-weight:500;color:var(--tx);margin:8px 0 6px;line-height:1.3">${q.q}</p>
    <p class="muted" style="margin-bottom:22px">${q.sub}</p>
    ${q.opts.map(o=>`<div class="ob-opt ${S.ob.ans[q.key]===o.v?'sel':''}" onclick="obSel('${q.key}',${JSON.stringify(o.v)})">
      <div class="ob-icon">${o.i}</div>
      <span style="font-size:15px">${o.l}</span>
    </div>`).join('')}
    ${S.ob.ans[q.key]!==undefined?`<button class="btn btn-p" style="margin-top:18px" onclick="obNext()">Continue →</button>`:''}
    ${step>0?`<button class="btn btn-g" style="width:100%;padding:12px;margin-top:6px;font-size:14px" onclick="obBack()">← Back</button>`:''}
  </div>`;
}
function obSel(k,v){S.ob.ans[k]=v;draw();}
function obNext(){S.ob.step++;draw();}
function obBack(){S.ob.step=Math.max(0,S.ob.step-1);draw();}
function obDone(){S.view='app';S.tab='home';sv();draw();}

// ── HOME ─────────────────────────────────────────────────────────────────────

function homeView(){
  const d=new Date();
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const sess=T.days[S.day];
  return`<div class="pad screen">
    <span class="label">${days[d.getDay()]} · ${d.getDate()} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]}</span>
    <p class="h1" style="margin:6px 0 24px">Good to see you.</p>
    <div class="card" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;cursor:pointer" onclick="go('today')">
      <div>
        <span class="label" style="color:var(--acc)">Today's session</span>
        <p style="font-size:16px;font-weight:500;margin:5px 0 4px">${T.name}</p>
        <p class="muted">${sess.label} · ${sess.focus} · ~${sess.mins} min</p>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </div>
    <span class="label" style="display:block;margin-bottom:12px">From your coach</span>
    ${INFO.map(n=>`<div class="card ${n.type==='notice'?'card-acc':'card-blue'}" style="margin-bottom:8px">
      <span class="label" style="color:${n.type==='notice'?'var(--acc)':'var(--acc2)'}">${n.type==='notice'?'Coach notice':'Training tip'}</span>
      <p style="font-size:14px;font-weight:500;margin:5px 0 4px;color:${n.type==='notice'?'#ddc89a':'#b8d4f0'}">${n.title}</p>
      <p style="font-size:13px;line-height:1.5;color:${n.type==='notice'?'#8a6430':'#336699'}">${n.body}</p>
    </div>`).join('')}
  </div>`;
}

// ── TODAY ────────────────────────────────────────────────────────────────────

function todayView(){
  const sess=T.days[S.day];
  const phases=[...new Set(sess.exercises.map(e=>e.ph))];
  return`<div class="pad screen">
    <span class="label">${T.name} · ${sess.label}</span>
    <p class="h1" style="margin:6px 0 4px">${sess.focus}</p>
    <p class="muted" style="margin-bottom:14px">${sess.exercises.length} exercises · ~${sess.mins} min</p>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px">
      ${phases.map(p=>`<span class="pill ${PH[p].cls}">${PH[p].label}</span>`).join('')}
    </div>
    ${sess.exercises.map((ex,i)=>{
      const str=ex.ph==='strength';
      return`<div class="ex-row ${str?'ex-str':''}" onclick="toggleEx(${i})">
        <div class="dot" style="background:${PH[ex.ph].dot}"></div>
        <div style="flex:1;min-width:0">
          <span class="label" style="color:${str?'var(--acc)':'var(--muted)'}">${PH[ex.ph].label}</span>
          <p style="font-size:14px;font-weight:${str?'500':'400'};color:${str?'var(--tx)':'#c0c0c0'};margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ex.name}</p>
        </div>
        <span style="font-size:12px;color:${str?'var(--acc)':'var(--muted)'};white-space:nowrap;margin-left:8px">${ex.vol}</span>
      </div>
      <div id="xd${i}" style="display:none;background:var(--bg2);border-radius:0 0 12px 12px;padding:12px 14px 14px;margin-top:-7px;margin-bottom:7px;border:.5px solid var(--border);border-top:none">
        <p style="font-size:12px;color:var(--muted);margin-bottom:8px"><strong style="color:var(--tx)">Muscles:</strong> ${ex.muscles}</p>
        ${ex.cues.map(c=>`<div class="cue">${c}</div>`).join('')}
        <p style="font-size:12px;color:var(--dim);margin-top:8px;font-style:italic">Substitutes: ${ex.subs}</p>
        ${ex.prog?`<p style="font-size:12px;color:var(--acc);margin-top:6px">Progression: ${ex.prog}</p>`:''}
      </div>`;
    }).join('')}
    <div style="margin-top:8px">
      <button class="btn btn-p" onclick="wxStart()">Start session →</button>
      <div style="display:flex;gap:8px;margin-top:10px">
        ${T.days.map((d,i)=>`<button onclick="switchDay(${i})" style="flex:1;padding:10px;border-radius:10px;border:1px solid ${i===S.day?'var(--acc)':'var(--border)'};background:${i===S.day?'#1e1000':'transparent'};color:${i===S.day?'var(--acc)':'var(--muted)'};font-size:12px;cursor:pointer">${d.label}</button>`).join('')}
      </div>
    </div>
  </div>`;
}
function toggleEx(i){const el=document.getElementById('xd'+i);if(el)el.style.display=el.style.display==='none'?'block':'none';}
function switchDay(i){S.day=i;sv();draw();}

// ── WORKOUT PLAYER ───────────────────────────────────────────────────────────

function wxStart(){
  const exs=T.days[S.day].exercises.filter(e=>e.sets);
  const weights={};
  exs.forEach(e=>{weights[e.id]=e.kg||0;});
  S.wx={on:true,label:T.days[S.day].label,exs,idx:0,set:1,logs:[],rest:false,restLeft:0,restTotal:0,weights};
  sv();draw();
}

let _tick=null;
function tickRest(){
  clearInterval(_tick);
  if(!S.wx||!S.wx.rest)return;
  _tick=setInterval(()=>{
    if(!S.wx||!S.wx.rest){clearInterval(_tick);return;}
    S.wx.restLeft=Math.max(0,S.wx.restLeft-1);
    const te=document.getElementById('rt');
    if(te)te.textContent=fmtT(S.wx.restLeft);
    const re=document.getElementById('rr');
    if(re){const pct=S.wx.restLeft/S.wx.restTotal;re.style.strokeDashoffset=440-(440*(1-pct));}
    if(S.wx.restLeft<=0){S.wx.rest=false;sv();clearInterval(_tick);draw();}
  },1000);
}

function fmtT(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

function wxView(){
  const w=S.wx;
  const ex=w.exs[w.idx];
  if(!ex){
    clearInterval(_tick);
    return`<div class="pad screen" style="padding-top:80px;text-align:center">
      <p style="font-size:52px;margin-bottom:16px">✓</p>
      <p class="h1" style="margin-bottom:8px">Session complete!</p>
      <p class="muted" style="margin-bottom:8px">${w.label} · ${w.logs.length} sets logged</p>
      <p class="muted" style="margin-bottom:48px">Great work. Rest, recover, come back stronger.</p>
      <button class="btn btn-p" onclick="wxEnd()">Back to home</button>
    </div>`;
  }
  if(w.rest){
    return`<div class="pad screen" style="padding-top:32px;text-align:center">
      <span class="label">Resting</span>
      <p style="font-size:16px;font-weight:500;margin:8px 0 32px">Next: ${ex.name} — set ${w.set} of ${ex.sets}</p>
      <div style="position:relative;width:160px;height:160px;margin:0 auto 32px">
        <svg width="160" height="160" viewBox="0 0 160 160">
          <circle cx="80" cy="80" r="70" fill="none" stroke="var(--bg3)" stroke-width="8"/>
          <circle id="rr" cx="80" cy="80" r="70" fill="none" stroke="var(--acc)" stroke-width="8" stroke-linecap="round" stroke-dasharray="440" stroke-dashoffset="0" transform="rotate(-90 80 80)" style="transition:stroke-dashoffset 1s linear"/>
        </svg>
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)">
          <p id="rt" style="font-size:32px;font-weight:500;color:var(--acc);font-variant-numeric:tabular-nums">${fmtT(w.restLeft)}</p>
        </div>
      </div>
      <button class="btn btn-o" onclick="wxSkipRest()">Skip rest →</button>
    </div>`;
  }
  const bw=!ex.kg&&ex.id!=='carry';
  const cueIdx=Math.min(w.set-1,ex.cues.length-1);
  return`<div>
    <div style="padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:.5px solid var(--border)">
      <button class="btn-g" style="font-size:14px;padding:4px" onclick="wxConfirmEnd()">✕ End</button>
      <p style="font-size:12px;color:var(--muted)">${w.label} · ${w.idx+1}/${w.exs.length}</p>
      <div style="width:48px"></div>
    </div>
    <div class="pad screen" style="padding-top:18px">
      <span class="label" style="color:${PH[ex.ph].dot}">Set ${w.set} of ${ex.sets}</span>
      <div style="display:flex;gap:5px;margin:7px 0 16px">
        ${Array.from({length:ex.sets},(_,i)=>`<div class="setpip ${i<w.set?'done':''}"></div>`).join('')}
      </div>
      <p class="h1" style="margin-bottom:4px">${ex.name}</p>
      <p class="muted" style="margin-bottom:22px">${ex.muscles}</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px">
        <div class="card" style="text-align:center">
          <span class="label">Target</span>
          <p style="font-size:28px;font-weight:500;margin-top:6px">${ex.reps||'—'} <span style="font-size:13px;color:var(--muted)">${ex.reps?'reps':''}</span></p>
        </div>
        ${bw?`<div class="card" style="text-align:center"><span class="label">Type</span><p style="font-size:15px;font-weight:500;color:var(--acc);margin-top:8px">Bodyweight</p></div>`
        :`<div class="card" style="text-align:center;background:#1c1000;border-color:#3a1e00">
          <span class="label" style="color:var(--acc)">Weight (kg)</span>
          <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px">
            <button class="num-btn" onclick="adjW(-2.5)">−</button>
            <span id="wd" style="font-size:24px;font-weight:500;color:var(--acc);min-width:52px;text-align:center">${w.weights[ex.id]}</span>
            <button class="num-btn" onclick="adjW(2.5)">+</button>
          </div>
        </div>`}
      </div>
      <div class="card" style="margin-bottom:18px">
        <span class="label">Form cue</span>
        <p style="font-size:13px;color:var(--muted);line-height:1.6;margin-top:6px;font-style:italic">"${ex.cues[cueIdx]}"</p>
      </div>
      <button class="btn btn-p" onclick="wxLog()">Log set &amp; rest →</button>
      ${w.idx<w.exs.length-1?`<p style="text-align:center;margin-top:10px;font-size:12px;color:var(--dim)">Next: ${w.exs[w.idx+1].name}</p>`:''}
    </div>
  </div>`;
}

function adjW(d){
  const ex=S.wx.exs[S.wx.idx];
  S.wx.weights[ex.id]=Math.round((S.wx.weights[ex.id]+d)*10)/10;
  const el=document.getElementById('wd');
  if(el)el.textContent=S.wx.weights[ex.id];
}

function wxLog(){
  const w=S.wx;const ex=w.exs[w.idx];
  w.logs.push({name:ex.name,set:w.set,reps:ex.reps,kg:w.weights[ex.id],ts:Date.now()});
  if(w.set<ex.sets){
    w.set++;
    if(ex.rest>0){w.rest=true;w.restLeft=ex.rest;w.restTotal=ex.rest;}
  }else{
    w.idx++;w.set=1;
    if(w.idx<w.exs.length){
      const nx=w.exs[w.idx];
      if(nx.rest>0){w.rest=true;w.restLeft=nx.rest;w.restTotal=nx.rest;}
    }
  }
  sv();draw();
}

function wxSkipRest(){S.wx.rest=false;sv();draw();}

function wxConfirmEnd(){
  if(confirm('End this session?'))wxEnd();
}

function wxEnd(){
  if(S.wx&&S.wx.logs.length>0){
    S.hist.push({date:new Date().toISOString(),label:S.wx.label,logs:S.wx.logs});
    S.day=(S.day+1)%T.days.length;
  }
  clearInterval(_tick);S.wx=null;S.tab='home';sv();draw();
}

// ── SKILLS ───────────────────────────────────────────────────────────────────

function skillsView(){
  return`<div class="pad screen">
    <span class="label">Movement skills</span>
    <p class="h1" style="margin:6px 0 8px">Master the foundations</p>
    <p class="muted" style="margin-bottom:24px">These patterns underpin every exercise in your program. Work through each level at your own pace.</p>
    ${SKILLS.map(sk=>{
      const lv=parseInt(localStorage.getItem('sk_'+sk.id)||'1');
      const open=S.skillsOpen===sk.id;
      return`<div class="card" style="margin-bottom:12px">
        <div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer" onclick="toggleSk('${sk.id}')">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="width:40px;height:40px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;color:var(--acc)">${sk.icon}</div>
            <div>
              <p style="font-size:15px;font-weight:500">${sk.name}</p>
              <p class="muted">Level ${lv} of ${sk.levels.length}</p>
            </div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--dim)" stroke-width="2" style="transform:rotate(${open?180:0}deg);transition:transform .2s;flex-shrink:0"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        ${open?`<div style="margin-top:14px">
          <div class="pbar" style="margin-bottom:16px"><div class="pfill" style="width:${(lv/sk.levels.length*100).toFixed(0)}%"></div></div>
          ${sk.levels.map((l,i)=>{
            const done=i+1<lv,cur=i+1===lv;
            return`<div style="padding:12px;border-radius:10px;background:${cur?'#1c1000':done?'var(--bg3)':'var(--bg3)'};border:1px solid ${cur?'var(--acc)':'transparent'};margin-bottom:8px">
              <div style="display:flex;justify-content:space-between;margin-bottom:5px">
                <span style="font-size:13px;font-weight:500;color:${done?'var(--ok)':cur?'var(--acc)':'var(--dim)'}">Level ${i+1}: ${l.n}</span>
                ${done?'<span style="font-size:11px;color:var(--ok)">✓</span>':cur?'<span style="font-size:11px;color:var(--acc)">current</span>':''}
              </div>
              <p style="font-size:13px;color:var(--muted);margin-bottom:5px">${l.d}</p>
              <p style="font-size:12px;color:var(--dim);font-style:italic">Test: ${l.t}</p>
            </div>`;
          }).join('')}
          ${lv<sk.levels.length?`<button class="btn btn-o" style="margin-top:6px" onclick="advSk('${sk.id}')">Mark level ${lv} complete →</button>`:`<p style="text-align:center;color:var(--ok);font-size:14px;padding:10px">Skill mastered ✓</p>`}
        </div>`:''}
      </div>`;
    }).join('')}
  </div>`;
}
function toggleSk(id){S.skillsOpen=S.skillsOpen===id?null:id;draw();}
function advSk(id){
  const sk=SKILLS.find(s=>s.id===id);
  const cur=parseInt(localStorage.getItem('sk_'+id)||'1');
  if(cur<sk.levels.length){localStorage.setItem('sk_'+id,cur+1);draw();}
}

// ── PROGRESS ─────────────────────────────────────────────────────────────────

function progressView(){
  const sessions=S.hist.length;
  const lifts={};
  S.hist.forEach(h=>h.logs.forEach(l=>{
    if(!lifts[l.name])lifts[l.name]=[];
    if(l.kg>0)lifts[l.name].push(l.kg);
  }));
  return`<div class="pad screen">
    <span class="label">Your progress</span>
    <p class="h1" style="margin:6px 0 22px">${T.name}</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px">
      <div class="card" style="text-align:center">
        <span class="label">Sessions</span>
        <p style="font-size:32px;font-weight:500;margin:8px 0 4px">${sessions}</p>
        <p style="font-size:12px;color:var(--acc)">total logged</p>
      </div>
      <div class="card" style="text-align:center">
        <span class="label">Next up</span>
        <p style="font-size:16px;font-weight:500;margin:8px 0 4px">${T.days[S.day].label}</p>
        <p class="muted" style="font-size:12px">${T.days[S.day].focus}</p>
      </div>
    </div>
    ${sessions===0?`<div class="card" style="text-align:center;padding:36px 20px">
      <p style="font-size:32px;margin-bottom:12px">→</p>
      <p class="h2" style="margin-bottom:8px">No sessions yet</p>
      <p class="muted">Complete your first session to see your strength progress here.</p>
    </div>`:
    `<span class="label" style="display:block;margin-bottom:12px">Strength progress</span>
    ${Object.entries(lifts).filter(([,v])=>v.length>0).slice(0,6).map(([name,vals])=>{
      const first=vals[0],last=vals[vals.length-1],delta=last-first;
      const pct=Math.min(100,(last/80)*100).toFixed(0);
      return`<div class="card" style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <p style="font-size:14px;font-weight:500">${name}</p>
          ${delta!==0?`<span style="font-size:12px;color:var(--ok)">+${delta} kg</span>`:'<span style="font-size:12px;color:var(--muted)">tracking</span>'}
        </div>
        <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
        <div style="display:flex;justify-content:space-between;margin-top:5px">
          <span style="font-size:11px;color:var(--muted)">${first} kg</span>
          <span style="font-size:11px;color:var(--acc)">${last} kg</span>
        </div>
      </div>`;
    }).join('')}
    <div style="margin-top:16px">
      <button class="btn-g" style="width:100%;padding:12px;font-size:13px;border:.5px solid var(--border);border-radius:12px" onclick="if(confirm('Reset all progress data?')){S.hist=[];sv();draw();}">Reset progress data</button>
    </div>`}
  </div>`;
}

// ── INIT ─────────────────────────────────────────────────────────────────────

ld();draw();
setInterval(()=>{
  const n=new Date(),t=document.getElementById('clk');
  if(t)t.textContent=n.getHours()+':'+String(n.getMinutes()).padStart(2,'0');
},15000);
</script>
</body>
</html>
