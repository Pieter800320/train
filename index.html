<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Train">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<title>Train</title>
<style>
:root{--bg:#111;--bg2:#1a1a1a;--bg3:#222;--acc:#E07B3A;--acc2:#3A82E0;--tx:#f0f0f0;--mu:#888;--dim:#444;--brd:#2a2a2a;--ok:#4aaa60;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif}
#app{max-width:430px;margin:0 auto;min-height:100vh}
.pad{padding:20px 16px 90px}
.lbl{font-size:10px;letter-spacing:.8px;color:var(--mu);text-transform:uppercase;font-weight:500}
.mu{font-size:13px;color:var(--mu);line-height:1.6}
.h1{font-size:22px;font-weight:500;line-height:1.3}
.h2{font-size:18px;font-weight:500}
.card{background:var(--bg2);border-radius:var(--r);padding:16px;border:.5px solid var(--brd)}
.cacc{border-left:3px solid var(--acc);border-radius:0 12px 12px 0;background:#160e00}
.cblu{border-left:3px solid var(--acc2);border-radius:0 12px 12px 0;background:#001422}
.btn{display:block;width:100%;padding:16px;border:none;border-radius:14px;font-size:15px;font-weight:500;cursor:pointer;text-align:center}
.btnp{background:var(--acc);color:#fff}
.btno{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.btng{background:transparent;border:none;color:var(--mu);cursor:pointer;width:100%;padding:12px;font-size:14px}
.pill{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:500}
.pgr{background:var(--bg3);color:var(--mu)}
.pac{background:#2a1400;color:var(--acc)}
.pbl{background:#001422;color:var(--acc2)}
.pok{background:#0a1e0a;color:var(--ok)}
#tb{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#161616;border-top:.5px solid var(--brd);display:grid;grid-template-columns:repeat(4,1fr);padding:10px 0 24px;z-index:100}
.ti{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--dim);padding:4px}
.ti.on{color:var(--acc)}
.ti svg{width:22px;height:22px}
.ti span{font-size:10px;font-weight:500}
.exrow{background:var(--bg2);border-radius:12px;padding:13px 14px;margin-bottom:7px;display:flex;align-items:center;gap:12px;border:.5px solid var(--brd);cursor:pointer}
.exstr{background:#1c1000;border-color:#3a1e00}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pb{background:var(--bg3);border-radius:4px;height:5px;overflow:hidden}
.pf{background:var(--acc);height:100%;border-radius:4px;transition:width .3s}
.opt{background:var(--bg2);border:1px solid var(--brd);border-radius:14px;padding:15px 18px;margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:14px}
.opt.sel{border-color:var(--acc);background:#1e1000}
.oico{width:36px;height:36px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--acc);flex-shrink:0}
.sp{width:24px;height:4px;border-radius:2px;background:var(--bg3)}
.sp.dn{background:var(--acc)}
.nb{background:var(--bg3);border:none;color:var(--tx);width:32px;height:32px;border-radius:8px;font-size:18px;cursor:pointer}
.cue{font-size:13px;color:var(--mu);padding:6px 10px;border-left:2px solid var(--brd);margin:4px 0;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div style="background:var(--bg);padding:12px 20px 6px;display:flex;justify-content:space-between;align-items:center">
    <span id="clk" style="font-size:11px;color:var(--mu);font-weight:500">9:41</span>
    <span style="font-size:12px;color:var(--mu);font-weight:500">Train</span>
    <span style="font-size:11px;color:var(--mu)">&#9679;&#9679;&#9679;</span>

  <div id="scr"></div>

    <div class="ti" id="t-home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg><span>Home</span></div>

  </nav>
</div>

  if(!INFO_URL||INFO_URL==='YOUR_SCRIPT_URL_HERE')return;

// STATE ----------------------------------------------------------------------

var S={view:'ob',tab:'home',day:0,ob:{step:0,ans:{}},wx:null,hist:[],skOpen:null};

function ld(){try{var d=localStorage.getItem('train_v2');if(d)S=JSON.parse(d);}catch(e){}}
function sv(){try{localStorage.setItem('train_v2',JSON.stringify(S));}catch(e){}}

// ROUTER ---------------------------------------------------------------------

function go(tab){S.tab=tab;sv();draw();}

function draw(){
  var sc=document.getElementById('scr');
  var tb=document.getElementById('tb');
  if(!sc)return;
  if(S.view==='ob'){
    tb.style.display='none';
    sc.innerHTML=obV();
  } else if(S.wx&&S.wx.on){
    tb.style.display='none';
    sc.innerHTML=wxV();
    tickR();
  } else {
    tb.style.display='grid';
    ['home','today','skills','progress'].forEach(function(t){
      var el=document.getElementById('t-'+t);
      if(el)el.className='ti'+(t===S.tab?' on':'');
    });
    var views={home:homeV,today:todayV,skills:skillsV,progress:progV};
    sc.innerHTML=views[S.tab]?views[S.tab]():'';
  }
}

// ONBOARDING -----------------------------------------------------------------

function obV(){
  var step=S.ob.step;
  if(step>=OBQ.length){
    var rows='';
    var keys={goal:'Goal',exp:'Experience',days:'Days/week',injury:'Injuries',sport:'Sport'};

    return '<div class="pad"><span class="lbl">Almost done</span><p class="h1" style="margin:8px 0">Your program is ready.</p><p class="mu" style="margin-bottom:24px">Based on your answers we have assigned Balanced Strength 3x per week — a full-body approach that builds strength, corrects imbalances, and teaches you to move well.</p><div class="card" style="margin-bottom:10px"><span class="lbl">Your program</span><p class="h2" style="margin:6px 0 3px">Balanced Strength</p><p class="mu">3 sessions per week · Full body · ~45 min</p></div><div class="card" style="margin-bottom:28px"><span class="lbl">Your profile</span>'+rows+'</div><button class="btn btnp" onclick="obDone()">Start training</button></div>';
  }
  var q=OBQ[step];
  var pct=Math.round(step/OBQ.length*100);
  var opts='';
  for(var i=0;i<q.opts.length;i++){
    var o=q.opts[i];
    var sel=S.ob.ans[q.key]===o.v?' sel':'';

// WORKOUT PLAYER -------------------------------------------------------------

function wxStart(){
  var exs=[];
  var sess=TPL.days[S.day];
  for(var i=0;i<sess.exercises.length;i++){if(sess.exercises[i].sets)exs.push(sess.exercises[i]);}
  var weights={};
  for(var i=0;i<exs.length;i++)weights[exs[i].id]=exs[i].kg||0;
  S.wx={on:true,label:sess.label,exs:exs,idx:0,set:1,logs:[],rest:false,rl:0,rt:0,weights:weights};
  sv();draw();
}

var _t=null;
function tickR(){
  clearInterval(_t);
  if(!S.wx||!S.wx.rest)return;
  _t=setInterval(function(){
    if(!S.wx||!S.wx.rest){clearInterval(_t);return;}
    S.wx.rl=Math.max(0,S.wx.rl-1);
    var te=document.getElementById('rt');
    if(te)te.textContent=fmt(S.wx.rl);
    var re=document.getElementById('rr');
    if(re)re.style.strokeDashoffset=440-(440*(1-S.wx.rl/S.wx.rt));
    if(S.wx.rl<=0){S.wx.rest=false;sv();clearInterval(_t);draw();}
  },1000);
}
function fmt(s){return Math.floor(s/60)+':'+('0'+s%60).slice(-2);}

function wxV(){
  var w=S.wx;

  }

  var cueIdx=Math.min(w.set-1,ex.cues.length-1);
  var pips='';
  for(var i=0;i<ex.sets;i++)pips+='<div class="sp'+(i<w.set?' dn':'')+'"></div>';
  var wgtBlock=bw?
    '<div class="card" style="text-align:center"><span class="lbl">Type</span><p style="font-size:15px;font-weight:500;color:var(--acc);margin-top:8px">Bodyweight</p></div>':
    '<div class="card" style="text-align:center;background:#1c1000;border-color:#3a1e00"><span class="lbl" style="color:var(--acc)">Weight (kg)</span><div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px"><button class="nb" onclick="adjW(-2.5)">&#8722;</button><span id="wd" style="font-size:24px;font-weight:500;color:var(--acc);min-width:52px;text-align:center">'+w.weights[ex.id]+'</span><button class="nb" onclick="adjW(2.5)">+</button></div></div>';
  var nextLine=w.idx<w.exs.length-1?'<p style="text-align:center;margin-top:10px;font-size:12px;color:var(--dim)">Next: '+w.exs[w.idx+1].name+'</p>':'';
  return '<div><div style="padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:.5px solid var(--brd)"><button class="btng" style="width:auto;padding:4px 8px;font-size:14px" onclick="wxConfirmEnd()">&#10005; End</button><p style="font-size:12px;color:var(--mu)">'+w.label+' &middot; '+(w.idx+1)+'/'+w.exs.length+'</p><div style="width:48px"></div></div><div class="pad" style="padding-top:18px"><span class="lbl" style="color:'+PH[ex.ph].dot+'">Set '+w.set+' of '+ex.sets+'</span><div style="display:flex;gap:5px;margin:7px 0 16px">'+pips+'</div><p class="h1" style="margin-bottom:4px">'+ex.name+'</p><p class="mu" style="margin-bottom:22px">'+ex.muscles+'</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px"><div class="card" style="text-align:center"><span class="lbl">Target</span><p style="font-size:28px;font-weight:500;margin-top:6px">'+(ex.reps||'&#8212;')+' <span style="font-size:13px;color:var(--mu)">'+(ex.reps?'reps':'')+'</span></p></div>'+wgtBlock+'</div><div class="card" style="margin-bottom:18px"><span class="lbl">Form cue</span><p style="font-size:13px;color:var(--mu);line-height:1.6;margin-top:6px;font-style:italic">"'+ex.cues[cueIdx]+'"</p></div><button class="btn btnp" onclick="wxLog()">Log set and rest</button>'+nextLine+'</div></div>';
}

function adjW(d){
  var ex=S.wx.exs[S.wx.idx];
  S.wx.weights[ex.id]=Math.round((S.wx.weights[ex.id]+d)*10)/10;
  var el=document.getElementById('wd');
  if(el)el.textContent=S.wx.weights[ex.id];
}
function wxLog(){
  var w=S.wx;var ex=w.exs[w.idx];
  w.logs.push({name:ex.name,set:w.set,reps:ex.reps,kg:w.weights[ex.id]});
  if(w.set<ex.sets){
    w.set++;
    if(ex.rest>0){w.rest=true;w.rl=ex.rest;w.rt=ex.rest;}
  } else {
    w.idx++;w.set=1;
    if(w.idx<w.exs.length&&w.exs[w.idx].rest>0){w.rest=true;w.rl=w.exs[w.idx].rest;w.rt=w.exs[w.idx].rest;}
  }
  sv();draw();
}
function wxSkip(){S.wx.rest=false;sv();draw();}
function wxConfirmEnd(){if(confirm('End this session?'))wxEnd();}
function wxEnd(){
  if(S.wx&&S.wx.logs.length>0){S.hist.push({date:new Date().toISOString(),label:S.wx.label,logs:S.wx.logs});S.day=(S.day+1)%TPL.days.length;}
  clearInterval(_t);S.wx=null;S.tab='home';sv();draw();
}

// PROGRESS -------------------------------------------------------------------

function progV(){
  var sessions=S.hist.length;
  var lifts={};
  for(var i=0;i<S.hist.length;i++){
    for(var j=0;j<S.hist[i].logs.length;j++){
      var l=S.hist[i].logs[j];
      if(l.kg>0){if(!lifts[l.name])lifts[l.name]=[];lifts[l.name].push(l.kg);}
    }
  }
  var liftHtml='';
  var names=Object.keys(lifts).slice(0,6);
  for(var i=0;i<names.length;i++){
    var nm=names[i],vals=lifts[nm],first=vals[0],last=vals[vals.length-1],delta=last-first;
    var pct=Math.min(100,Math.round(last/80*100));
    liftHtml+='<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><p style="font-size:14px;font-weight:500">'+nm+'</p>'+(delta!==0?'<span style="font-size:12px;color:var(--ok)">+'+delta+' kg</span>':'<span style="font-size:12px;color:var(--mu)">tracking</span>')+'</div><div class="pb"><div class="pf" style="width:'+pct+'%"></div></div><div style="display:flex;justify-content:space-between;margin-top:5px"><span style="font-size:11px;color:var(--mu)">'+first+' kg</span><span style="font-size:11px;color:var(--acc)">'+last+' kg</span></div></div>';
  }
  var empty='<div class="card" style="text-align:center;padding:36px 20px"><p style="font-size:32px;margin-bottom:12px">&#8594;</p><p class="h2" style="margin-bottom:8px">No sessions yet</p><p class="mu">Complete your first session to see strength progress here.</p></div>';
  var reset=sessions>0?'<div style="margin-top:16px"><button class="btng" style="width:100%;padding:12px;font-size:13px;border:.5px solid var(--brd);border-radius:12px" onclick="if(confirm(\'Reset all progress?\''+")"+"{"+"S.hist=[];sv();draw();"+"}"+')">Reset progress data</button></div>':'';
  return '<div class="pad"><span class="lbl">Your progress</span><p class="h1" style="margin:6px 0 22px">'+TPL.name+'</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px"><div class="card" style="text-align:center"><span class="lbl">Sessions</span><p style="font-size:32px;font-weight:500;margin:8px 0 4px">'+sessions+'</p><p style="font-size:12px;color:var(--acc)">total logged</p></div><div class="card" style="text-align:center"><span class="lbl">Next up</span><p style="font-size:16px;font-weight:500;margin:8px 0 4px">'+TPL.days[S.day].label+'</p><p class="mu" style="font-size:12px">'+TPL.days[S.day].focus+'</p></div></div>'+(sessions===0?empty:'<span class="lbl" style="display:block;margin-bottom:12px">Strength progress</span>'+liftHtml)+reset+'</div>';
}

// EVENT DELEGATION -----------------------------------------------------------

document.addEventListener('click',function(e){
  var t=e.target;
  // Walk up to find a handled element
  while(t&&t!==document.body){
    // Onboarding option
    if(t.dataset&&t.dataset.key&&t.dataset.val!==undefined){
      S.ob.ans[t.dataset.key]=t.dataset.val;draw();return;
    }
    // Toggle exercise detail
    if(t.dataset&&t.dataset.xd!==undefined){
      var el=document.getElementById('xd'+t.dataset.xd);
      if(el)el.style.display=el.style.display==='none'?'block':'none';
      return;
    }
    // Switch day
    if(t.dataset&&t.dataset.switchday!==undefined){
      S.day=parseInt(t.dataset.switchday);sv();draw();return;
    }
    // Toggle skill
    if(t.dataset&&t.dataset.togglesk){
      S.skOpen=S.skOpen===t.dataset.togglesk?null:t.dataset.togglesk;draw();return;
    }
    // Advance skill
    if(t.dataset&&t.dataset.advsk){
      var id=t.dataset.advsk;
      var sk=null;for(var i=0;i<SKILLS.length;i++)if(SKILLS[i].id===id)sk=SKILLS[i];
      var cur=parseInt(localStorage.getItem('sk_'+id)||'1');
      if(sk&&cur<sk.lvls.length){localStorage.setItem('sk_'+id,cur+1);draw();}
      return;
    }
    // Tab bar
    if(t.id&&t.id.indexOf('t-')===0){go(t.id.slice(2));return;}
    t=t.parentElement;
  }
});

// ICON -----------------------------------------------------------------------

function makeIcon(){
  try{
    var c=document.createElement('canvas');
    c.width=c.height=192;
    var ctx=c.getContext('2d');
    ctx.fillStyle='#111111';
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(0,0,192,192,40);
    else{ctx.rect(0,0,192,192);}
    ctx.fill();
    ctx.fillStyle='#E07B3A';
    ctx.font='bold 110px -apple-system,sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('T',96,102);
    var url=c.toDataURL('image/png');
    var lnk=document.createElement('link');
    lnk.rel='apple-touch-icon';
    lnk.href=url;
    document.head.appendChild(lnk);
  }catch(e){}
}
